name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          node --check app.js
          node --check data/geometry.js
          node --check scripts/sync-geometry-json.js
          node scripts/sync-geometry-json.js --check
          test -s index.html
          test -s 404.html
          test -s styles.css
          test -s data/geometry.json
          test -s scripts/sync-geometry-json.js
          test -f .nojekyll
          test -s og.png
          test -s favicon.svg
          test -s robots.txt
          test -s sitemap.xml
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const source = {
            title: 'Sacred Geometry Atlas',
            schema: context.window.CHURCH_GEOMETRY_SCHEMA,
            studies: context.window.CHURCH_GEOMETRY
          };
          const exported = JSON.parse(fs.readFileSync('data/geometry.json', 'utf8'));
          if (JSON.stringify(exported) !== JSON.stringify(source)) throw new Error('data/geometry.json is out of sync with data/geometry.js');
          const requiredTextFields = ['id', 'index', 'name', 'shortName', 'typology', 'place', 'era', 'emphasis', 'type', 'churchName', 'status', 'source', 'sourceNote', 'envelope', 'axis', 'surfaceNote', 'exteriorNote', 'interiorNote'];
          const requiredNumericFields = ['length', 'span', 'height', 'bayCount', 'module', 'radius', 'symmetry'];
          const optionalNumericFields = ['floorAreaEstimate', 'volumeEstimate'];
          const statusValues = new Set((source.schema && source.schema.statusValues) || []);
          const statusDefinitions = (source.schema && source.schema.statusDefinitions) || {};
          for (const status of statusValues) {
            if (typeof statusDefinitions[status] !== 'string' || !statusDefinitions[status].trim()) throw new Error(`Schema is missing a definition for status: ${status}`);
          }
          const ids = new Set();
          const indexes = new Set();
          source.studies.forEach((study, index) => {
            for (const field of requiredTextFields) {
              if (typeof study[field] !== 'string' || !study[field].trim()) throw new Error(`Study ${index + 1} has missing text field: ${field}`);
            }
            for (const field of requiredNumericFields) {
              if (!Number.isFinite(study[field]) || study[field] <= 0) throw new Error(`Study ${study.id || index + 1} has invalid numeric field: ${field}`);
            }
            for (const field of optionalNumericFields) {
              if (study[field] !== undefined && (!Number.isFinite(study[field]) || study[field] <= 0)) throw new Error(`Study ${study.id || index + 1} has invalid optional numeric field: ${field}`);
            }
            if (study.volumeBasis !== undefined && (typeof study.volumeBasis !== 'string' || !study.volumeBasis.trim())) throw new Error(`Study ${study.id || index + 1} has invalid volume basis`);
            if (ids.has(study.id)) throw new Error(`Duplicate study id: ${study.id}`);
            if (indexes.has(study.index)) throw new Error(`Duplicate study index: ${study.index}`);
            if (!statusValues.has(study.status)) throw new Error(`Study ${study.id} has unsupported status: ${study.status}`);
            if (!Number.isInteger(study.bayCount)) throw new Error(`Study ${study.id} must use an integer bayCount`);
            if (study.symmetry > 1) throw new Error(`Study ${study.id} has symmetry above 1`);
            if (!Array.isArray(study.details) || !study.details.length || study.details.some((detail) => !Array.isArray(detail) || detail.length !== 2 || detail.some((value) => typeof value !== 'string' || !value.trim()))) {
              throw new Error(`Study ${study.id} has invalid details`);
            }
            ids.add(study.id);
            indexes.add(study.index);
          });
          console.log(`Geometry schema validation passed: ${source.studies.length} records.`);
          const html = fs.readFileSync('index.html', 'utf8');
          const notFound = fs.readFileSync('404.html', 'utf8');
          const app = fs.readFileSync('app.js', 'utf8');
          const styles = fs.readFileSync('styles.css', 'utf8');
          const robots = fs.readFileSync('robots.txt', 'utf8');
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const workflow = fs.readFileSync('.github/workflows/pages.yml', 'utf8');
          const requiredMetadata = [
            'property="og:image" content="og.png"',
            'property="og:url" content="./"',
            'name="twitter:image" content="og.png"',
            'name="twitter:card" content="summary_large_image"',
            'property="og:image:width" content="1200"',
            'property="og:image:height" content="630"',
            'name="robots" content="index, follow"',
            'rel="canonical" href="./"',
            'rel="alternate" type="application/json" title="Sacred Geometry Atlas dataset" href="data/geometry.json"'
          ];
          for (const token of requiredMetadata) {
            if (!html.includes(token)) throw new Error(`Missing metadata: ${token}`);
          }
          if (!robots.includes('User-agent: *') || !robots.includes('Allow: /') || !robots.includes('Sitemap: ./sitemap.xml') || !sitemap.includes('<loc>./</loc>')) throw new Error('Repository-relative crawl metadata is incomplete');
          if (!notFound.includes('<meta name="robots" content="noindex, nofollow" />')) throw new Error('404 pages must opt out of search indexing');
          for (const token of ['From this already initialized checkout', 'git branch -M main', 'git push -u origin main', 'If `git status` shows local changes', 'git add .', 'node scripts/sync-geometry-json.js', 'favicon.svg', 'robots.txt', 'sitemap.xml', 'stamps the final absolute Pages URL', 'The committed tree already includes the Pages workflow']) {
            if (!readme.includes(token)) throw new Error(`GitHub Pages publishing guide is missing: ${token}`);
          }
          for (const token of ['id: pages', 'Stamp deployed site metadata', 'Verify deployed site metadata', 'PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}', 'Sitemap: ./sitemap.xml', '<loc>./</loc>']) {
            if (!workflow.includes(token)) throw new Error(`Pages deployment metadata handoff is missing: ${token}`);
          }
          if (!workflow.includes('node scripts/sync-geometry-json.js --check')) throw new Error('Pages validation must check the generated geometry artifact');
          if (!html.includes('<body class="no-js">') || !html.includes('<script>document.body.classList.add("js-runtime");</script>')) throw new Error('Missing no-JS/runtime fallback markers');
          if (!html.includes('<h1 id="noscript-heading" tabindex="-1">')) throw new Error('No-JS fallback must provide the page heading');
          if (!html.includes('<a class="skip-link skip-link-app" href="#main-content">Skip to content</a>')) throw new Error('Missing interactive skip link');
          if (!html.includes('<a class="skip-link skip-link-noscript" href="#noscript-heading">Skip to collection</a>')) throw new Error('Missing no-JS skip link');
          if (!html.includes('<main id="main-content" tabindex="-1">') || !html.includes('<h1 id="noscript-heading" tabindex="-1">') || !styles.includes('#main-content:focus-visible') || !styles.includes('#noscript-heading:focus-visible')) throw new Error('Skip-link destinations must be focusable and visibly styled');
          if (!html.includes('<div class="hero-stats" role="group" aria-label="Atlas statistics">')) throw new Error('Hero statistics must expose a named group');
          for (const token of ['id="studyCount"', 'id="modeCount"', 'id="profileCount"']) {
            if (!html.includes(token)) throw new Error('Hero statistics must expose a dynamic target: ' + token);
          }
          if (!html.includes('<div class="study-nav" id="studyNav" role="group" aria-label="Move between studies">') || !html.includes('<span class="study-nav-position" id="studyNavPosition">01 / 06 visible</span>') || !styles.includes('.study-nav-position {') || !app.includes('const positionLabel = visible.length && currentIndex >= 0') || !app.includes('navigation.setAttribute("aria-label", visible.length && currentIndex >= 0')) throw new Error('Study navigation must expose its position within the visible collection');
          for (const token of ['function renderHeroStats()', 'studyCount: studies.length', 'modeCount: validModes.size', 'profileCount: activeStudy() ? profileScores(activeStudy()).length : 0', 'renderHeroStats();', 'function atlasSchemaNoteText(records = studies)', 'function renderAtlasSchemaNote()', 'renderAtlasSchemaNote();']) {
            if (!app.includes(token)) throw new Error('Hero statistics must derive from live atlas state: ' + token);
          }
          if (!html.includes('<p class="section-note" id="atlasSchemaNote">Illustrative proportions · metric units · v1.1</p>')) throw new Error('Atlas collection note must expose a dynamic schema target');
          if (!html.includes('<span id="methodProvenanceNote">The current collection is a schematic proportional study, not a measured survey or a claim about every church. Each record carries a status and provenance note.</span>') || !app.includes('function methodProvenanceText(records = studies)') || !app.includes('function renderMethodProvenance()') || !app.includes('renderMethodProvenance();')) throw new Error('Method provenance warning must adapt to live dataset status');
          if (!notFound.includes('<main class="error-page" aria-labelledby="error-title">')) throw new Error('Missing branded 404 main landmark');
          if (!notFound.includes('id="error-title"')) throw new Error('Missing branded 404 heading');
          if (!notFound.includes('data-site-root') || !notFound.includes('data-site-dataset')) throw new Error('Missing GitHub Pages recovery navigation');
          if (!notFound.includes("hostname.endsWith('.github.io')")) throw new Error('Missing project-site root resolver');
          if (!notFound.includes('<link rel="icon" id="site-favicon" href="favicon.svg" type="image/svg+xml" />')) throw new Error('Missing 404 favicon link');
          if (!notFound.includes("favicon.href = `${siteRoot}favicon.svg`")) throw new Error("Missing 404 favicon root resolver");
          if (!notFound.includes('link.href = `${siteRoot}data/geometry.json`')) throw new Error('Missing 404 dataset root resolver');
          if (!html.includes('<div class="data-error" id="dataError" role="alert" aria-labelledby="dataErrorHeading" hidden>') || !html.includes('<h1 id="dataErrorHeading" tabindex="-1">')) throw new Error('Missing focusable data-load recovery heading');
          if (!html.includes('<div class="runtime-fallback" id="runtimeFallback" role="status" aria-live="polite" aria-atomic="true" aria-labelledby="runtimeFallbackHeading">') || !html.includes('<p id="runtimeFallbackHeading"><strong>The atlas is still loading.</strong>')) throw new Error('Missing polite runtime script-failure recovery panel');
          if (!html.includes('<a class="hero-action" href="data/geometry.json">Open the static JSON dataset') || !html.includes('<a class="noscript-link" href="data/geometry.json">Open the JSON dataset') || html.includes('href="data/geometry.json" download=')) throw new Error('Static recovery links must open the JSON artifact without forcing a download');
          const initStart = app.indexOf('function init()');
          const initEnd = app.indexOf('\n  function renderHeroStats()', initStart);
          const syncStart = app.indexOf('function syncFromHash()');
          const syncEnd = app.indexOf('\n\n  function populateFilter()', syncStart);
          const syncBody = app.slice(syncStart, syncEnd);
          if (initStart < 0 || initEnd < 0 || syncStart < 0 || syncEnd < 0 || app.slice(0, initStart).includes('document.body.classList.remove("no-js");') || syncBody.lastIndexOf('document.body.classList.remove("no-js");') < syncBody.lastIndexOf('renderAll();')) throw new Error('App must remain gated until its first successful render');
          if (!app.includes('const revealPending = document.body.classList.contains("no-js");') || !app.includes('previousPage === route.page || revealPending') || !app.includes('pageChanged && !document.body.classList.contains("no-js")')) throw new Error('Initial deep-link focus must wait until the app is visible');
          if (!styles.includes('.no-js .runtime-fallback { display: none; }') || !styles.includes('.js-runtime.no-js .runtime-fallback { display: block; }') || !styles.includes('.data-error-state .runtime-fallback { display: none; }')) throw new Error('Runtime recovery panel must not compete with no-script or data-error states');
          if (!html.includes('<link rel="icon" href="favicon.svg" type="image/svg+xml" />')) throw new Error('Missing branded favicon link');
          if (!html.includes('Dimensions are shown as length × span × height in meters.') || !html.includes('The records are labeled schematic and use the Sacred Geometry Atlas proportional model; they are not a measured survey.')) throw new Error('Missing no-script dimensions or provenance note');
          const noScriptList = html.match(/<ol class="noscript-list">([\s\S]*?)<\/ol>/);
          if (!noScriptList) throw new Error('Missing no-script study list');
          const noScriptEntries = [...noScriptList[1].matchAll(/<li>([\s\S]*?)<\/li>/g)].map((match) => match[1]);
          if (noScriptEntries.length !== source.studies.length) throw new Error(`No-script fallback has ${noScriptEntries.length} entries; expected ${source.studies.length}`);
          for (const study of source.studies) {
            const dimensions = [study.length, study.span, study.height].join(' × ') + ' m';
            const entry = noScriptEntries.find((candidate) => candidate.includes(study.name));
            if (!entry || [study.name, study.typology, study.place, study.era, study.emphasis, study.status, dimensions, study.churchName, study.surfaceNote].some((value) => !entry.includes(value))) {
              throw new Error('No-script fallback is missing ' + study.id + ': ' + dimensions + ' / ' + study.churchName + ' / reading');
            }
          }
          if (!html.includes('<ul class="catalog-list" id="churchList"')) throw new Error('Catalog must use a semantic list');
          for (const token of ['data-view="atlas" type="button" aria-controls="atlas" aria-current="page"', 'data-view="compare" type="button" aria-controls="compareView"', '<span class="nav-count" id="compareNavCount" aria-hidden="true" hidden></span>', 'data-view="method" type="button" aria-controls="methodView"']) {
            if (!html.includes(token)) throw new Error('Missing navigation relationship: ' + token);
          }
          if (!html.includes('<p class="section-note" id="compareSectionNote">Relative readings · full collection</p>') || !html.includes('<span class="card-kicker" id="geometryCompareKicker">00 / collection geometry</span>') || !app.includes('function renderCompareContext()') || !app.includes('const compareScopeLabel = focused ? "selected collection" : "full collection";') || !app.includes('sectionNote.textContent = `Relative readings · ${compareScopeLabel}`;') || !app.includes('geometryKicker.textContent = focused ? "00 / selected geometry" : "00 / collection geometry";')) throw new Error('Comparison copy must identify the active full or focused collection');
          if (!html.includes('<summary id="comparisonTableSummary">Read the 6 study records as a table</summary>') || !app.includes('const summary = $("#comparisonTableSummary");') || !app.includes('Read the ${comparison.length} selected study records as a table') || !app.includes('Read the ${comparison.length} study records as a table')) throw new Error('Comparison table trigger must identify its active record scope');
          if (!app.includes('class="comparison-table-study-link"') || !app.includes('data-table-study') || !app.includes('comparisonTable.addEventListener("click"') || !styles.includes('.comparison-table-study-link {')) throw new Error('Comparison table study names must provide route-native Atlas links');
          for (const token of ['function updateCompareNavigation()', 'const label = selectedCount ? `Compare (${selectedCount} selected)` : "Compare";', 'button.setAttribute("aria-label", label);', 'count.hidden = selectedCount === 0;', 'updateCompareNavigation();']) {
            if (!app.includes(token)) throw new Error('Compare navigation state must reflect the active selection: ' + token);
          }
          if (!styles.includes('.nav-count {') || !styles.includes('  justify-content: center;\n  gap: 0.38rem;') || !styles.includes('.nav-count { border-color: Highlight; color: HighlightText; background: Highlight; }')) throw new Error('Compare navigation count must remain aligned and visible in forced-colors mode');
          if (!html.includes('id="emptyStateMessage"')) throw new Error('Missing contextual catalog empty state');
          if (!html.includes('<span class="sr-only" id="catalogLiveStatus" role="status" aria-live="polite" aria-atomic="true"></span>')) throw new Error('Catalog scope changes must have a live status channel');
          if (!html.includes('<div class="visual-empty-state" id="visualEmptyState" role="region" aria-labelledby="visualEmptyHeading" aria-describedby="visualEmptyMessage" hidden>')) throw new Error('Missing visual empty state');
          if (!html.includes('id="clearVisualFilters" type="button"')) throw new Error('Missing visual empty-state recovery action');
          if (!html.includes('<a class="hero-action" href="#methodView">Read the method')) throw new Error('Method link must target the real section');
          if (!html.includes('<section class="method-readings" aria-labelledby="derived-readings-heading">') || !html.includes('id="derived-readings-heading"') || !html.includes('Bounding area') || !html.includes('Reading profile') || !styles.includes('.method-readings-grid')) throw new Error('Method view must explain derived readings');
          if (!html.includes('<button class="share-button method-return-button" id="methodBackToStudy" type="button" aria-controls="atlas" aria-label="Open current study in Atlas"') || !app.includes('function renderMethodReturnAction(study = activeStudy(), visible = visibleStudies())') || !app.includes('visible.some((candidate) => candidate.id === study.id)') || !app.includes('$("#methodBackToStudy").addEventListener("click"') || !styles.includes('.section-heading-actions {') || !styles.includes('.method-return-button {')) throw new Error('Method view must provide a context-aware return-to-study action');
          if (!app.includes('const methodLink = $(\'.hero-action[href="#methodView"]\');') || !app.includes('showPage(button.dataset.view, { routeStudy: button.dataset.view === "method" });') || !app.includes('showPage("method", { routeStudy: true });') || !app.includes('showPage("atlas", { routeStudy: canOpenStudy });') || !app.includes('document.title = contextStudy')) throw new Error('Method navigation must preserve the active study context and return cleanly from filtered views');
          if (!html.includes('<p class="section-note" id="methodContextNote">Notes on the atlas model</p>') || !app.includes('function renderMethodContext(study = activeStudy(), visible = visibleStudies())') || !app.includes('Current study · ${studyShortName(study)}') || !app.includes('outside current catalog') || !app.includes('if (page === "method") renderMethodContext();')) throw new Error('Method view must identify its preserved study context visibly');
          if (!html.includes('<div class="study-context-note" id="activeCatalogContext" aria-live="polite" aria-atomic="true" hidden>') || !html.includes('id="activeCatalogContextText"') || !html.includes('id="showActiveStudy" type="button"') || !app.includes('if (!route.studyId) state.activeId = visible[0].id;') || !app.includes('function renderActiveCatalogContext(study = activeStudy(), visible = visibleStudies())') || !app.includes('outsideCatalog') || !app.includes('$("#showActiveStudy").addEventListener("click"') || !styles.includes('.study-context-note {') || !styles.includes('.study-context-note button {')) throw new Error('Filtered study deep links must remain open and explain how to restore the study in the catalog');
          if (!html.includes('data-layer="measure" type="button" aria-pressed="false" aria-controls="geometryCanvas">Dimensions</button>')) throw new Error('Dimension layer must use clear schematic terminology');
          if (!html.includes('<div class="metric-strip" role="group" aria-label="Primary dimensions">')) throw new Error('Primary dimension group must use clear schematic terminology');
          if (!html.includes('<span class="metric-label">overall length</span>') || !html.includes('id="metricLength"')) throw new Error('Primary dimension group must expose overall length');
          if (!html.includes('<option value="length">Length · longest first</option>') || !html.includes('<option value="name">Name · A–Z</option>')) throw new Error('Catalog must expose direction-aware sorting');
          if (!html.includes('id="activeReference"')) throw new Error('Missing visible study reference');
          if (!html.includes('<h3 id="activeName" tabindex="-1" aria-describedby="activeStatusHelp">The longitudinal basilica</h3><span class="study-status" id="activeStatus" title="Illustrative proportions; not a measured survey.">SCHEMATIC</span><span class="sr-only" id="activeStatusHelp">Illustrative proportions; not a measured survey.</span>') || !html.includes('<details class="study-provenance" id="activeProvenance">') || !html.includes('<summary id="activeProvenanceSummary">Data status · schematic</summary>') || !html.includes('id="activeProvenanceDefinition"') || !html.includes('id="activeSchemaNote"') || !app.includes('const studyStatusDescription = (study) => dataStatusDefinitions()[studyStatus(study)]') || !app.includes('activeStatusHelp.textContent = statusDefinition;') || !app.includes('activeStatus.title = statusDefinition;') || !app.includes('activeStatus.setAttribute("aria-label", `${status}: ${statusDefinition}`);') || !app.includes('function renderActiveProvenance(study)') || !app.includes('summary.textContent = `Data status · ${status}`;') || !app.includes('schemaNote.textContent = `Schema ${schema.version || "1.1"} · units: ${schema.units || "meters"}`;') || !styles.includes('.study-provenance summary {') || !styles.includes('summary:focus-visible') || !styles.includes('.study-provenance-body {')) throw new Error('Active study status must expose a discoverable schema-backed provenance disclosure');
          if (!html.includes('id="analysisReading"')) throw new Error('Missing interpretive reading');
          if (!html.includes('id="profileRow" role="list" aria-label="Reading profile scores"')) throw new Error('Missing semantic reading-profile list');
          if (!html.includes('<details class="shortcut-guide">')) throw new Error('Missing keyboard shortcut guide');
          if (!html.includes('dimension line')) throw new Error('Missing clear schematic dimension label');
          for (const token of ['data-surface="exterior" type="button" aria-pressed="true" aria-controls="geometryCanvas"', 'data-mode="plan" type="button" aria-pressed="true" aria-controls="geometryCanvas"', 'data-layer="all" type="button" aria-pressed="true" aria-controls="geometryCanvas"']) {
            if (!html.includes(token)) throw new Error('Missing initial pressed state: ' + token);
          }
          if (!html.includes('aria-keyshortcuts="J"') || !html.includes('id="openCompare" type="button" aria-controls="compareView" aria-keyshortcuts="C"') || !html.includes('<kbd>C</kbd>') || !html.includes('Open focused comparison') || !app.includes('if (key === "c")') || !app.includes('showPage("compare");') || !app.includes('Select at least two studies to open comparison.')) throw new Error('Missing comparison keyboard shortcut guidance');
          for (const token of ['id="zoomReset" type="button" aria-label="Reset zoom to 100%" aria-controls="geometryCanvas"', 'id="resetDrawing" type="button" aria-label="Reset drawing to outside plan, all geometry, and 100% zoom" aria-controls="geometryCanvas"', 'id="zoomOut" type="button" aria-label="Zoom out" aria-controls="geometryCanvas"', 'id="zoomIn" type="button" aria-label="Zoom in" aria-controls="geometryCanvas"', 'id="zoomReadout" role="status" aria-live="polite"', 'id="catalogResultCount" role="status" aria-live="polite" aria-atomic="true" aria-label="06 of 06 studies; the full collection."']) {
            if (!html.includes(token)) throw new Error(`Missing accessible zoom control: ${token}`);
          }
          if (!app.includes('const MIN_ZOOM = 0.7;') || !app.includes('const MAX_ZOOM = 1.6;') || !app.includes('zoomOut.disabled = state.zoom <= MIN_ZOOM;') || !app.includes('zoomIn.disabled = state.zoom >= MAX_ZOOM;') || !app.includes('Zoom out (minimum 70%)') || !app.includes('Zoom in (maximum 160%)') || !styles.includes('.zoom-control button:disabled')) throw new Error('Zoom limits must expose disabled endpoint controls');
          if (!app.includes('$("#metricLength").textContent = `${number(study.length)} m`;') || !styles.includes('.metric-strip { display: grid; grid-template-columns: repeat(5, 1fr);') || !styles.includes('.metric-cell:nth-child(even)') || !styles.includes('.metric-cell:nth-child(-n + 4)')) throw new Error('Overall length metric must render and reflow responsively');
          if (!html.includes('id="downloadDrawing" type="button" aria-label="Export the current drawing as SVG"')) throw new Error('Missing accessible drawing export label');
          if (!html.includes('<span class="sr-only" id="drawingDownloadStatus" role="status" aria-live="polite"></span>')) throw new Error('Drawing export must have a nearby live status channel');
          const drawingExportStart = app.indexOf('function downloadDrawing()');
          const drawingExportEnd = app.indexOf('\n  function downloadStudy()', drawingExportStart);
          const drawingExport = app.slice(drawingExportStart, drawingExportEnd);
          if (drawingExportStart < 0 || drawingExportEnd < 0 || !drawingExport.includes('const status = $("#drawingDownloadStatus");') || drawingExport.includes('const status = $("#downloadStatus");')) throw new Error('Drawing export must announce completion through its dedicated status channel');
          if (!html.includes('id="downloadData" type="button" aria-label="Download full atlas data as JSON"')) throw new Error('Missing accessible full-data download label');
          if (!html.includes('id="downloadStudy" type="button" aria-label="Download active study as JSON"')) throw new Error('Missing accessible study-data download label');
          if (!html.includes('id="shareStudy" type="button" aria-label="Share current study"')) throw new Error('Missing accessible study share label');
