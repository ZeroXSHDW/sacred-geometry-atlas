name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static site
        run: |
          node --check app.js
          node --check data/geometry.js
          node --check scripts/sync-geometry-json.js
          node scripts/sync-geometry-json.js --check
          test -s index.html
          test -s 404.html
          test -s styles.css
          test -s data/geometry.json
          test -s data/geometry.csv
          test -s data/geometry.schema.json
          test -s scripts/sync-geometry-json.js
          test -f .nojekyll
          test -s og.png
          test -s favicon.svg
          test -s robots.txt
          test -s sitemap.xml
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const source = {
            title: 'Sacred Geometry Atlas',
            schema: context.window.CHURCH_GEOMETRY_SCHEMA,
            schemaUrl: 'data/geometry.schema.json',
            studies: context.window.CHURCH_GEOMETRY
          };
          const exported = JSON.parse(fs.readFileSync('data/geometry.json', 'utf8'));
          const publishedSchema = JSON.parse(fs.readFileSync('data/geometry.schema.json', 'utf8'));
          if (JSON.stringify(exported) !== JSON.stringify(source)) throw new Error('data/geometry.json is out of sync with data/geometry.js');
          const csv = fs.readFileSync('data/geometry.csv', 'utf8').replace(/^\uFEFF/, '');
          const csvRows = csv.trimEnd().split(/\r?\n/);
          if (csvRows.length !== source.studies.length + 1 || !csvRows[0].startsWith('"ID","Study","Typology"') || !csvRows[0].includes(`"Length (${source.schema.unitSymbol})"`) || !csvRows[0].includes('"Status definition"') || !csvRows[0].includes('"Schema URL"')) throw new Error('data/geometry.csv is missing its schema-backed header or records');
          source.studies.forEach((study, index) => {
            if (!csvRows[index + 1].startsWith(`"${study.id}"`) || !csvRows[index + 1].includes(`"#atlas/${encodeURIComponent(study.id)}/plan/exterior/all"`) || !csvRows[index + 1].includes(`"${source.schemaUrl}"`)) throw new Error(`data/geometry.csv is missing the direct route or schema URL for ${study.id}`);
          });
          const requiredTextFields = ['id', 'index', 'name', 'shortName', 'typology', 'place', 'era', 'emphasis', 'type', 'churchName', 'status', 'source', 'sourceNote', 'envelope', 'axis', 'surfaceNote', 'exteriorNote', 'interiorNote'];
          const requiredNumericFields = ['length', 'span', 'height', 'bayCount', 'module', 'radius', 'symmetry'];
          const optionalNumericFields = ['floorAreaEstimate', 'volumeEstimate'];
          if (!source.schema || typeof source.schema.units !== 'string' || !source.schema.units.trim() || typeof source.schema.unitSymbol !== 'string' || !source.schema.unitSymbol.trim()) throw new Error('Geometry schema must define a display unit name and symbol');
          const statusValues = new Set((source.schema && source.schema.statusValues) || []);
          const statusDefinitions = (source.schema && source.schema.statusDefinitions) || {};
          for (const status of statusValues) {
            if (typeof statusDefinitions[status] !== 'string' || !statusDefinitions[status].trim()) throw new Error(`Schema is missing a definition for status: ${status}`);
          }
          if (publishedSchema.$schema !== 'https://json-schema.org/draft/2020-12/schema' || publishedSchema.$id !== './geometry.schema.json' || !publishedSchema.required?.includes('schemaUrl') || publishedSchema.properties?.schemaUrl?.const !== source.schemaUrl || publishedSchema.$defs?.study?.properties?.status?.enum?.join('|') !== [...statusValues].join('|')) throw new Error('data/geometry.schema.json is missing the generated schema contract');
          const ids = new Set();
          const indexes = new Set();
          source.studies.forEach((study, index) => {
            for (const field of requiredTextFields) {
              if (typeof study[field] !== 'string' || !study[field].trim()) throw new Error(`Study ${index + 1} has missing text field: ${field}`);
            }
            for (const field of requiredNumericFields) {
              if (!Number.isFinite(study[field]) || (field === 'symmetry' ? study[field] < 0 : study[field] <= 0)) throw new Error(`Study ${study.id || index + 1} has invalid numeric field: ${field}`);
            }
            for (const field of optionalNumericFields) {
              if (study[field] !== undefined && (!Number.isFinite(study[field]) || study[field] <= 0)) throw new Error(`Study ${study.id || index + 1} has invalid optional numeric field: ${field}`);
            }
            if (study.volumeBasis !== undefined && (typeof study.volumeBasis !== 'string' || !study.volumeBasis.trim())) throw new Error(`Study ${study.id || index + 1} has invalid volume basis`);
            if (ids.has(study.id)) throw new Error(`Duplicate study id: ${study.id}`);
            if (indexes.has(study.index)) throw new Error(`Duplicate study index: ${study.index}`);
            if (!statusValues.has(study.status)) throw new Error(`Study ${study.id} has unsupported status: ${study.status}`);
            if (!Number.isInteger(study.bayCount)) throw new Error(`Study ${study.id} must use an integer bayCount`);
            if (study.symmetry > 1) throw new Error(`Study ${study.id} has symmetry above 1`);
            if (!Array.isArray(study.details) || !study.details.length || study.details.some((detail) => !Array.isArray(detail) || detail.length !== 2 || detail.some((value) => typeof value !== 'string' || !value.trim()))) {
              throw new Error(`Study ${study.id} has invalid details`);
            }
            ids.add(study.id);
            indexes.add(study.index);
          });
          console.log(`Geometry schema validation passed: ${source.studies.length} records.`);
          const html = fs.readFileSync('index.html', 'utf8');
          const notFound = fs.readFileSync('404.html', 'utf8');
          const app = fs.readFileSync('app.js', 'utf8');
          const styles = fs.readFileSync('styles.css', 'utf8');
          const robots = fs.readFileSync('robots.txt', 'utf8');
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const workflow = fs.readFileSync('.github/workflows/pages.yml', 'utf8');
          if (!workflow.includes("      - name: Set up Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22")) throw new Error('Pages validation must pin Node.js 22');
          const structuredDataMatch = html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
          if (!structuredDataMatch) throw new Error('Missing collection JSON-LD metadata');
          let structuredData;
          try {
            structuredData = JSON.parse(structuredDataMatch[1]);
          } catch (error) {
            throw new Error('Collection JSON-LD metadata is not valid JSON');
          }
          const structuredDataset = structuredData && structuredData.mainEntity;
          const distributions = structuredDataset && Array.isArray(structuredDataset.distribution) ? structuredDataset.distribution : [];
          const jsonDistribution = distributions.find((distribution) => distribution && distribution.encodingFormat === 'application/json');
          const csvDistribution = distributions.find((distribution) => distribution && distribution.encodingFormat === 'text/csv');
          const schemaDistribution = distributions.find((distribution) => distribution && distribution.encodingFormat === 'application/schema+json');
          if (structuredData['@context'] !== 'https://schema.org' || structuredData['@type'] !== 'CollectionPage' || structuredData.name !== 'Sacred Geometry Atlas' || !structuredDataset || structuredDataset['@type'] !== 'Dataset' || structuredDataset['@id'] !== 'data/geometry.json' || !jsonDistribution || jsonDistribution.contentUrl !== 'data/geometry.json' || !csvDistribution || csvDistribution.contentUrl !== 'data/geometry.csv' || !schemaDistribution || schemaDistribution.contentUrl !== 'data/geometry.schema.json') throw new Error('Collection JSON-LD metadata is incomplete');
          const requiredMetadata = [
            'property="og:image" content="og.png"',
            'property="og:url" content="./"',
            'name="twitter:image" content="og.png"',
            'name="twitter:card" content="summary_large_image"',
            'property="og:image:width" content="1200"',
            'property="og:image:height" content="630"',
            'name="robots" content="index, follow"',
            'rel="canonical" href="./"',
            'rel="alternate" type="application/json" title="Sacred Geometry Atlas dataset" href="data/geometry.json"',
            'rel="alternate" type="text/csv" title="Sacred Geometry Atlas dataset as CSV" href="data/geometry.csv"',
            'rel="alternate" type="application/schema+json" title="Sacred Geometry Atlas data schema" href="data/geometry.schema.json"'
          ];
          for (const token of requiredMetadata) {
            if (!html.includes(token)) throw new Error(`Missing metadata: ${token}`);
          }
          if (!robots.includes('User-agent: *') || !robots.includes('Allow: /') || !robots.includes('Sitemap: ./sitemap.xml') || !sitemap.includes('<loc>./</loc>') || !sitemap.includes('<loc>./data/geometry.json</loc>') || !sitemap.includes('<loc>./data/geometry.csv</loc>') || !sitemap.includes('<loc>./data/geometry.schema.json</loc>')) throw new Error('Repository-relative crawl metadata is incomplete');
          if (!notFound.includes('<meta name="robots" content="noindex, nofollow" />')) throw new Error('404 pages must opt out of search indexing');
          if (!notFound.includes('@media (pointer: coarse)') || !notFound.includes('.home-link { min-height: 44px; }') || !notFound.includes('@media (forced-colors: active)') || !notFound.includes('border-color: ButtonText; color: ButtonText; background: ButtonFace;') || !notFound.includes('color: HighlightText; background: Highlight;') || !notFound.includes('.error-footer strong { color: Highlight; }')) throw new Error('404 recovery actions must preserve touch targets and forced-colors affordances');
          for (const token of ['From this already initialized checkout', 'git branch -M main', 'git push -u origin main', 'If `git status` shows local changes', 'git add .', 'node scripts/sync-geometry-json.js', 'data/geometry.csv', 'data/geometry.schema.json', 'Raw CSV', 'Open schema', 'published schema URL', 'current site origin', 'JSON, CSV, and JSON Schema distributions', 'stamps the published JSON, CSV, and JSON Schema artifacts', 'favicon.svg', 'robots.txt', 'sitemap.xml', 'stamps the final absolute Pages URL', 'The committed tree already includes the Pages workflow']) {
            if (!readme.includes(token)) throw new Error(`GitHub Pages publishing guide is missing: ${token}`);
          }
          for (const token of ['id: pages', 'Stamp deployed site metadata', 'Verify deployed site metadata', 'PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}', 'schema_target = base_url + "data/geometry.schema.json"', 'dataset_marker = \'"schemaUrl": "data/geometry.schema.json"\'', 'schema_replacements = {', 'Sitemap: ./sitemap.xml', '<loc>./</loc>', '<loc>./data/geometry.json</loc>', '<loc>./data/geometry.csv</loc>', '<loc>./data/geometry.schema.json</loc>']) {
            if (!workflow.includes(token)) throw new Error(`Pages deployment metadata handoff is missing: ${token}`);
          }
          if (!workflow.includes("permissions:\n  contents: read\n\nconcurrency:") || !workflow.includes("  deploy:\n    needs: validate\n    if: github.event_name != 'pull_request'\n    permissions:\n      contents: read\n      pages: write\n      id-token: write")) throw new Error('Pages write and OIDC permissions must be scoped to the deploy job');
          if (!workflow.includes('node scripts/sync-geometry-json.js --check')) throw new Error('Pages validation must check the generated geometry artifact');
          if (!html.includes('<body class="no-js">') || !html.includes('<script>document.body.classList.add("js-runtime");</script>')) throw new Error('Missing no-JS/runtime fallback markers');
          if (!html.includes('<h1 id="noscript-heading" tabindex="-1">')) throw new Error('No-JS fallback must provide the page heading');
          if (!html.includes('<a class="skip-link skip-link-app" href="#main-content">Skip to content</a>')) throw new Error('Missing interactive skip link');
          if (!html.includes('<a class="skip-link skip-link-noscript" href="#noscript-heading">Skip to collection</a>')) throw new Error('Missing no-JS skip link');
          if (!html.includes('<a class="skip-link skip-link-runtime" href="#runtimeFallback">Skip to recovery</a>')) throw new Error('Missing runtime recovery skip link');
          if (!html.includes('<section class="noscript-index" role="main" aria-labelledby="noscript-heading">')) throw new Error('No-JS collection fallback must provide a main landmark');
          if (!html.includes('<main id="main-content" tabindex="-1">') || !html.includes('<h1 id="noscript-heading" tabindex="-1">') || !html.includes('id="runtimeFallback" role="main" aria-labelledby="runtimeFallbackHeading" tabindex="-1"') || !styles.includes('#main-content:focus-visible') || !styles.includes('#noscript-heading:focus-visible') || !styles.includes('#runtimeFallback:focus')) throw new Error('Skip-link destinations must be focusable and visibly styled');
          if (!html.includes('<div class="hero-stats" role="group" aria-label="Atlas statistics">')) throw new Error('Hero statistics must expose a named group');
          for (const token of ['id="studyCount"', 'id="modeCount"', 'id="profileCount"']) {
            if (!html.includes(token)) throw new Error('Hero statistics must expose a dynamic target: ' + token);
          }
          if (!html.includes('<div class="study-nav" id="studyNav" role="group" aria-label="Move between studies">') || !html.includes('<span class="study-nav-position" id="studyNavPosition">01 / 06 visible</span>') || !styles.includes('.study-nav-position {') || !app.includes('const activeStudyOutsideCatalog = visible.length > 0 && currentIndex < 0') || !app.includes('const positionLabel = currentIndex >= 0') || !app.includes('navigation.setAttribute("aria-label", currentIndex >= 0')) throw new Error('Study navigation must expose its position within the visible collection');
          for (const token of ['function renderHeroStats()', 'studyCount: studies.length', 'modeCount: validModes.size', 'profileCount: activeStudy() ? profileScores(activeStudy()).length : 0', 'renderHeroStats();', 'function atlasSchemaNoteText(records = studies)', 'function renderAtlasSchemaNote()', 'renderAtlasSchemaNote();']) {
            if (!app.includes(token)) throw new Error('Hero statistics must derive from live atlas state: ' + token);
          }
          if (!html.includes('<p class="section-note" id="atlasSchemaNote">Illustrative proportions · metric units · v1.1</p>')) throw new Error('Atlas collection note must expose a dynamic schema target');
          for (const token of ['<section class="method-dictionary" aria-labelledby="data-dictionary-heading">', 'id="data-dictionary-heading"', 'class="method-dictionary-links"', 'href="data/geometry.json">Open JSON', 'href="data/geometry.csv">Open CSV', 'href="data/geometry.schema.json">Open schema', '<code>floorAreaEstimate</code>', '<code>volumeBasis</code>', 'class="method-dictionary-formulas"']) {
            if (!html.includes(token)) throw new Error('Method data dictionary is incomplete: ' + token);
          }
          for (const token of ['class="shortcut-guide layer-guide"', '<summary aria-keyshortcuts="Escape">Layer guide</summary>', '<p>Focus layers</p>', '<dt>Envelope</dt><dd>Outer walls and enclosing geometric figure.</dd>', '<dt>Rhythm</dt><dd>Repeated bays, frames, and module marks.</dd>', '<dt>Dimensions</dt><dd>Schematic measures and construction references.</dd>']) {
            if (!html.includes(token)) throw new Error('Drawing layer guide is incomplete: ' + token);
          }
          for (const token of ['const layerDescriptions = {', 'const layerLabel = layer === "all" ? "All geometry"', 'button.setAttribute("aria-label", accessibleLabel);', 'button.title = accessibleLabel;', 'announceKeyboard(`${drawingStateLabel()} selected. ${layerDescriptions[state.layer] || "Geometry layer focus."}`);']) {
            if (!app.includes(token)) throw new Error('Drawing layer controls are missing accessible definitions: ' + token);
          }
          for (const token of ['.method-dictionary {', '.method-dictionary-grid {', '.method-dictionary-links a {', '.method-dictionary-item dd {', '.method-dictionary-formulas {']) {
            if (!styles.includes(token)) throw new Error('Method data dictionary styling is incomplete: ' + token);
          }
          if (!html.includes('<span id="methodProvenanceNote">The current collection is a schematic proportional study, not a measured survey or a claim about every church. Each record carries a status and provenance note.</span>') || !app.includes('const collectionProvenanceNote = () =>') || !app.includes('const note = geometrySchema().note;') || !app.includes('function methodProvenanceText(records = studies)') || !app.includes('function renderMethodProvenance()') || !app.includes('renderMethodProvenance();')) throw new Error('Method provenance warning must adapt to the schema collection note and live dataset status');
          if (!notFound.includes('<main class="error-page" aria-labelledby="error-title">')) throw new Error('Missing branded 404 main landmark');
          if (!notFound.includes('id="error-title"')) throw new Error('Missing branded 404 heading');
          if (!notFound.includes('data-site-root') || !notFound.includes('data-site-dataset') || !notFound.includes('data-site-csv') || !notFound.includes('data-site-schema')) throw new Error('Missing GitHub Pages recovery navigation');
          if (!notFound.includes("hostname.endsWith('.github.io')")) throw new Error('Missing project-site root resolver');
          if (!notFound.includes('<link rel="icon" id="site-favicon" href="favicon.svg" type="image/svg+xml" />')) throw new Error('Missing 404 favicon link');
          if (!notFound.includes("favicon.href = `${siteRoot}favicon.svg`")) throw new Error("Missing 404 favicon root resolver");
          if (!notFound.includes('link.href = `${siteRoot}data/geometry.json`') || !notFound.includes('link.href = `${siteRoot}data/geometry.csv`') || !notFound.includes('link.href = `${siteRoot}data/geometry.schema.json`')) throw new Error('Missing 404 dataset root resolver');
          if (!html.includes('<div class="data-error" id="dataError" role="main" aria-labelledby="dataErrorHeading" aria-describedby="dataErrorDescription" tabindex="-1" hidden>') || !html.includes('<h1 id="dataErrorHeading" tabindex="-1">') || !html.includes('<p id="dataErrorDescription" role="alert" aria-live="assertive" aria-atomic="true">The interactive collection is temporarily missing its local dataset.')) throw new Error('Data-load recovery must expose a main landmark and announce its recovery explanation assertively');
