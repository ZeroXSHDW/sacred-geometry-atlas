          if (meterCount !== context.window.CHURCH_GEOMETRY.length * 4 || !fullMarkup.includes('Interpretive reading profile for study ' + firstStudy.index + ', ' + firstLabelHtml) || !fullMarkup.includes('class="chart-study-index" aria-hidden="true">' + firstStudy.index + '</span>') || !fullMarkup.includes('Study ' + firstStudy.index + ', ' + firstLabelHtml + ' linearity interpretive score') || !fullMarkup.includes('Source: ' + firstSourceHtml) || !fullMarkup.includes('aria-valuetext="' + htmlEncode(profileText(firstStudy, 'linearity')) + '"') || !fullMarkup.includes('aria-valuetext="' + htmlEncode(profileText(firstStudy, 'radiality')) + '"') || !fullMarkup.includes('class="profile-compare-fill"')) throw new Error('Comparative reading profiles did not render curated indexed study identity, four accessible scores with measurement bases, and provenance context for every study');
          renderComparisonTable();
          const tableMarkup = elements.get('#comparisonTableBody').innerHTML;
          if (!tableMarkup.includes('data-profile="linearity" aria-label="Study ' + firstStudy.index + ', ' + firstLabelHtml + ' Linearity profile: ' + htmlEncode(profileText(firstStudy, 'linearity')) + '"') || !tableMarkup.includes('data-profile="verticality" aria-label="Study ' + firstStudy.index + ', ' + firstLabelHtml + ' Verticality profile: ' + htmlEncode(profileText(firstStudy, 'verticality')) + '"') || !tableMarkup.includes('data-profile="radiality" aria-label="Study ' + firstStudy.index + ', ' + firstLabelHtml + ' Radiality profile: ' + htmlEncode(profileText(firstStudy, 'radiality')) + '"') || !tableMarkup.includes('data-profile="repetition" aria-label="Study ' + firstStudy.index + ', ' + firstLabelHtml + ' Repetition profile: ' + htmlEncode(profileText(firstStudy, 'repetition')) + '"')) throw new Error('Comparison table profile cells did not preserve the curated indexed study identity and basis-specific accessible labels');
          renderCharts();
          const ratioMarkup = elements.get('#ratioChart').innerHTML;
          const heightMarkup = elements.get('#heightChart').innerHTML;
          const moduleMarkup = elements.get('#moduleChart').innerHTML;
          if (!ratioMarkup.includes('role="meter" aria-label="Study ' + firstStudy.index + ', ' + firstLabelHtml + ': Relative length to span ratio"') || !heightMarkup.includes('role="meter" aria-label="Study ' + firstStudy.index + ', ' + firstLabelHtml + ': Relative height to span ratio"') || !moduleMarkup.includes('role="meter" aria-label="Study ' + firstStudy.index + ', ' + firstLabelHtml + ': Relative module length"')) throw new Error('Comparison chart meters did not preserve the curated indexed study identity in their accessible labels');
          state.compareIds = [secondStudy.id, thirdStudy.id];
          renderProfileCompare();
          const focusedMarkup = elements.get('#profileCompare').innerHTML;
          if (!focusedMarkup.startsWith('<div class="profile-compare-row"') || (focusedMarkup.match(/role="listitem"/g) || []).length !== 2 || !focusedMarkup.includes(secondLabel) || !focusedMarkup.includes(thirdLabel) || focusedMarkup.indexOf(secondLabel) > focusedMarkup.indexOf(thirdLabel)) throw new Error('Comparative reading profiles did not honor focused comparison order and scope');
          console.log('Comparative reading profiles and export parity smoke test passed.');
