          if (!ratioChart.includes('estimated &lt;review&gt;') || ratioChart.includes('<review>') || ratioChart.includes('<pending review>') || !profileChart.includes('estimated &lt;review&gt;') || profileChart.includes('<review>') || profileChart.includes('<pending review>')) throw new Error('Custom schema status text must remain escaped in comparison chart markup');
          console.log('Escaped schema units in comparison surfaces smoke test passed.');
