          vm.runInNewContext(app, context);
          (async () => {
            const { copyCatalogRoute, copyStudyRoute, copyComparisonRoute, copyMethodRoute, dismissManualCopyFallback } = context.window.__atlasTest;
            await copyCatalogRoute();
            await copyStudyRoute();
            await copyComparisonRoute();
            await copyMethodRoute();
            const expected = [
              'https://example.test/atlas/?q=gothic#atlas',
              'https://example.test/atlas/#atlas/gothic/section/interior/axis/1.3',
              'https://example.test/atlas/?compare=basilica,gothic#compare/basilica,gothic',
              'https://example.test/atlas/?q=gothic&compare=basilica,gothic#method/gothic'
            ];
            if (copied.join('|') !== expected.join('|')) throw new Error('Route copy actions did not resolve each visible route to the full URL');
            if (elements.get('#catalogRouteStatus').textContent !== 'Catalog view route copied.' || elements.get('#studyRouteStatus').textContent !== 'Active study route copied.' || elements.get('#comparisonRouteStatus').textContent !== 'Comparison route copied.' || elements.get('#methodRouteStatus').textContent !== 'Method route copied.') throw new Error('Route copy actions did not announce success in their live regions');
            if (catalogButton.label.textContent !== 'Copied' || studyButton.label.textContent !== 'Copied' || comparisonButton.label.textContent !== 'Copied' || methodButton.label.textContent !== 'Copied') throw new Error('Route copy actions did not expose visible completion labels');
            if (catalogButton.disabled || catalogButton.attributes['aria-busy'] !== 'false' || studyButton.disabled || comparisonButton.disabled || methodButton.disabled) throw new Error('Route copy actions did not release their busy state');
            context.navigator.clipboard.writeText = () => Promise.reject(new Error('blocked'));
            const fallbackCases = [
              {
                copy: copyCatalogRoute,
                button: catalogButton,
