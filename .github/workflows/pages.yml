      - name: Audit HTML accessibility references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class AccessibilityAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.references = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  for key in ("aria-labelledby", "aria-describedby", "aria-controls", "aria-owns"):
                      if key in attrs:
                          self.references.extend(attrs[key].split())

          parser = AccessibilityAudit()
          parser.feed(Path("index.html").read_text())
          if len(parser.ids) != len(set(parser.ids)):
              raise SystemExit("Duplicate HTML IDs found")
          missing = sorted(set(parser.references) - set(parser.ids))
          if missing:
              raise SystemExit("Missing ARIA references: " + ", ".join(missing))
          print(f"Accessibility reference audit passed: {len(parser.ids)} unique IDs.")
          PY

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
