          if (!workflow.includes('      - name: Prepare Pages artifact') || !workflow.includes('site = Path("_site")') || !workflow.includes('path: "_site"') || workflow.includes('\n          path: "."') || !workflow.includes('custom_domain = Path("CNAME")') || !workflow.includes('expected.add("CNAME")') || !workflow.includes('expected_files.add("CNAME")')) throw new Error('Pages deployment must upload a curated public-site artifact and preserve an optional CNAME');
          if (!workflow.includes('node scripts/sync-geometry-json.js --check')) throw new Error('Pages validation must check the generated geometry artifact');
          if (!html.includes('<body class="no-js">') || !html.includes('document.body.classList.add("js-runtime");') || !html.includes('data-recovery-reload')) throw new Error('Missing no-JS/runtime fallback markers');
          if (!html.includes('<h1 id="noscript-heading" tabindex="-1">')) throw new Error('No-JS fallback must provide the page heading');
