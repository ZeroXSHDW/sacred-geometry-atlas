          for (const token of ['id="studyCount"', 'id="modeCount"', 'id="profileCount"']) {
            if (!html.includes(token)) throw new Error('Hero statistics must expose a dynamic target: ' + token);
          }
          if (!html.includes('<p class="hero-data-note" id="heroDataNote" data-status="schematic" role="note"') || !html.includes('id="heroDataNoteText"') || !html.includes('id="heroDataNoteDefinition"') || !styles.includes('.hero-aside {') || !styles.includes('.hero-data-note {') || !styles.includes('.hero-data-note-definition {') || !styles.includes('.hero-data-note[data-status="measured"]') || !styles.includes('.hero-data-note[data-status="mixed"]')) throw new Error('The landing hero must surface schema-driven dataset provenance with readable responsive styling');
          if (!styles.includes('.catalog-card-status:not([data-status="schematic"]):not([data-status="measured"])') || !styles.includes('.comparison-table tbody .comparison-status:not([data-status="schematic"]):not([data-status="measured"])') || !styles.includes('--coral-soft:')) throw new Error('Schema-extensible status badges must have a distinct non-schematic visual treatment');
          if (!html.includes('<div class="study-nav" id="studyNav" role="group" aria-label="Move between studies">') || !html.includes('<span class="study-nav-position" id="studyNavPosition">01 / 06 visible</span>') || !styles.includes('.study-nav-position {') || !app.includes('const activeStudyOutsideCatalog = visible.length > 0 && currentIndex < 0') || !app.includes('const positionLabel = currentIndex >= 0') || !app.includes('navigation.setAttribute("aria-label", currentIndex >= 0')) throw new Error('Study navigation must expose its position within the visible collection');
          for (const token of ['function renderHeroStats()', 'studyCount: studies.length', 'modeCount: validModes.size', 'profileCount: activeStudy() ? profileScores(activeStudy()).length : 0', 'renderHeroStats();', 'function renderHeroProvenance()', 'const summaryTarget = $("#heroDataNoteText")', 'const definitionTarget = $("#heroDataNoteDefinition")', 'const noteStatus = activeStatuses.length === 1', 'note.setAttribute("data-status", noteStatus);', 'renderHeroProvenance();', 'function atlasSchemaNoteText(records = studies)', 'function renderAtlasSchemaNote()', 'renderAtlasSchemaNote();']) {
