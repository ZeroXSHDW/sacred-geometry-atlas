name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          node --check app.js
          node --check data/geometry.js
          test -s index.html
          test -s 404.html
          test -s styles.css
          test -s data/geometry.json
          test -s og.png
          test -s favicon.svg
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const source = {
            title: 'Sacred Geometry Atlas',
            schema: context.window.CHURCH_GEOMETRY_SCHEMA,
            studies: context.window.CHURCH_GEOMETRY
          };
          const exported = JSON.parse(fs.readFileSync('data/geometry.json', 'utf8'));
          if (JSON.stringify(exported) !== JSON.stringify(source)) throw new Error('data/geometry.json is out of sync with data/geometry.js');
          const requiredTextFields = ['id', 'index', 'name', 'shortName', 'typology', 'place', 'era', 'emphasis', 'type', 'churchName', 'status', 'source', 'sourceNote', 'envelope', 'axis', 'surfaceNote', 'exteriorNote', 'interiorNote'];
          const requiredNumericFields = ['length', 'span', 'height', 'bayCount', 'module', 'radius', 'symmetry'];
          const optionalNumericFields = ['floorAreaEstimate', 'volumeEstimate'];
          const statusValues = new Set((source.schema && source.schema.statusValues) || []);
          const ids = new Set();
          const indexes = new Set();
          source.studies.forEach((study, index) => {
            for (const field of requiredTextFields) {
              if (typeof study[field] !== 'string' || !study[field].trim()) throw new Error(`Study ${index + 1} has missing text field: ${field}`);
            }
            for (const field of requiredNumericFields) {
              if (!Number.isFinite(study[field]) || study[field] <= 0) throw new Error(`Study ${study.id || index + 1} has invalid numeric field: ${field}`);
            }
            for (const field of optionalNumericFields) {
              if (study[field] !== undefined && (!Number.isFinite(study[field]) || study[field] <= 0)) throw new Error(`Study ${study.id || index + 1} has invalid optional numeric field: ${field}`);
            }
            if (study.volumeBasis !== undefined && (typeof study.volumeBasis !== 'string' || !study.volumeBasis.trim())) throw new Error(`Study ${study.id || index + 1} has invalid volume basis`);
            if (ids.has(study.id)) throw new Error(`Duplicate study id: ${study.id}`);
            if (indexes.has(study.index)) throw new Error(`Duplicate study index: ${study.index}`);
            if (!statusValues.has(study.status)) throw new Error(`Study ${study.id} has unsupported status: ${study.status}`);
            if (!Number.isInteger(study.bayCount)) throw new Error(`Study ${study.id} must use an integer bayCount`);
            if (study.symmetry > 1) throw new Error(`Study ${study.id} has symmetry above 1`);
            if (!Array.isArray(study.details) || !study.details.length || study.details.some((detail) => !Array.isArray(detail) || detail.length !== 2 || detail.some((value) => typeof value !== 'string' || !value.trim()))) {
              throw new Error(`Study ${study.id} has invalid details`);
            }
            ids.add(study.id);
            indexes.add(study.index);
          });
          console.log(`Geometry schema validation passed: ${source.studies.length} records.`);
          const html = fs.readFileSync('index.html', 'utf8');
          const notFound = fs.readFileSync('404.html', 'utf8');
          const app = fs.readFileSync('app.js', 'utf8');
          const styles = fs.readFileSync('styles.css', 'utf8');
          const requiredMetadata = [
            'property="og:image" content="og.png"',
            'name="twitter:image" content="og.png"',
            'name="twitter:card" content="summary_large_image"',
            'property="og:image:width" content="1200"',
            'property="og:image:height" content="630"'
          ];
          for (const token of requiredMetadata) {
            if (!html.includes(token)) throw new Error(`Missing metadata: ${token}`);
          }
          if (!html.includes('<body class="no-js">')) throw new Error('Missing no-JS fallback marker');
          if (!html.includes('<h1 id="noscript-heading" tabindex="-1">')) throw new Error('No-JS fallback must provide the page heading');
          if (!html.includes('<a class="skip-link skip-link-app" href="#main-content">Skip to content</a>')) throw new Error('Missing interactive skip link');
          if (!html.includes('<a class="skip-link skip-link-noscript" href="#noscript-heading">Skip to collection</a>')) throw new Error('Missing no-JS skip link');
          if (!html.includes('<main id="main-content" tabindex="-1">') || !html.includes('<h1 id="noscript-heading" tabindex="-1">')) throw new Error('Skip-link destinations must be focusable');
          if (!html.includes('<div class="hero-stats" role="group" aria-label="Atlas statistics">')) throw new Error('Hero statistics must expose a named group');
          if (!notFound.includes('<main class="error-page" aria-labelledby="error-title">')) throw new Error('Missing branded 404 main landmark');
          if (!notFound.includes('id="error-title"')) throw new Error('Missing branded 404 heading');
          if (!notFound.includes('data-site-root')) throw new Error('Missing GitHub Pages root navigation');
          if (!notFound.includes("hostname.endsWith('.github.io')")) throw new Error('Missing project-site root resolver');
          if (!notFound.includes('<link rel="icon" id="site-favicon" href="favicon.svg" type="image/svg+xml" />')) throw new Error('Missing 404 favicon link');
          if (!notFound.includes("favicon.href = `${siteRoot}favicon.svg`")) throw new Error("Missing 404 favicon root resolver");
          if (!html.includes('<div class="data-error" id="dataError" role="alert" aria-labelledby="dataErrorHeading" hidden>') || !html.includes('<h1 id="dataErrorHeading" tabindex="-1">')) throw new Error('Missing focusable data-load recovery heading');
          if (!html.includes('<link rel="icon" href="favicon.svg" type="image/svg+xml" />')) throw new Error('Missing branded favicon link');
          if (!html.includes('Dimensions are shown as length × span × height in meters.')) throw new Error('Missing no-script dimension legend');
          const noScriptList = html.match(/<ol class="noscript-list">([\s\S]*?)<\/ol>/);
          if (!noScriptList) throw new Error('Missing no-script study list');
          const noScriptEntries = [...noScriptList[1].matchAll(/<li>([\s\S]*?)<\/li>/g)].map((match) => match[1]);
          if (noScriptEntries.length !== source.studies.length) throw new Error(`No-script fallback has ${noScriptEntries.length} entries; expected ${source.studies.length}`);
          for (const study of source.studies) {
            const dimensions = [study.length, study.span, study.height].join(' × ') + ' m';
            const entry = noScriptEntries.find((candidate) => candidate.includes(study.name));
            if (!entry || [study.name, study.typology, study.place, study.era, study.emphasis, study.status, dimensions, study.churchName, study.surfaceNote].some((value) => !entry.includes(value))) {
              throw new Error('No-script fallback is missing ' + study.id + ': ' + dimensions + ' / ' + study.churchName + ' / reading');
            }
          }
          if (!html.includes('<ul class="catalog-list" id="churchList"')) throw new Error('Catalog must use a semantic list');
          for (const token of ['data-view="atlas" type="button" aria-controls="atlas" aria-current="page"', 'data-view="compare" type="button" aria-controls="compareView"', 'data-view="method" type="button" aria-controls="methodView"']) {
            if (!html.includes(token)) throw new Error('Missing navigation relationship: ' + token);
          }
          if (!html.includes('id="emptyStateMessage"')) throw new Error('Missing contextual catalog empty state');
          if (!html.includes('<span class="sr-only" id="catalogLiveStatus" role="status" aria-live="polite" aria-atomic="true"></span>')) throw new Error('Catalog scope changes must have a live status channel');
          if (!html.includes('<div class="visual-empty-state" id="visualEmptyState" role="region" aria-labelledby="visualEmptyHeading" aria-describedby="visualEmptyMessage" hidden>')) throw new Error('Missing visual empty state');
          if (!html.includes('id="clearVisualFilters" type="button"')) throw new Error('Missing visual empty-state recovery action');
          if (!html.includes('<a class="hero-action" href="#methodView">Read the method')) throw new Error('Method link must target the real section');
          if (!html.includes('data-layer="measure" type="button" aria-pressed="false" aria-controls="geometryCanvas">Dimensions</button>')) throw new Error('Dimension layer must use clear schematic terminology');
          if (!html.includes('<div class="metric-strip" role="group" aria-label="Primary dimensions">')) throw new Error('Primary dimension group must use clear schematic terminology');
          if (!html.includes('<span class="metric-label">overall length</span>') || !html.includes('id="metricLength"')) throw new Error('Primary dimension group must expose overall length');
          if (!html.includes('<option value="length">Length · longest first</option>') || !html.includes('<option value="name">Name · A–Z</option>')) throw new Error('Catalog must expose direction-aware sorting');
          if (!html.includes('id="activeReference"')) throw new Error('Missing visible study reference');
          if (!html.includes('<span class="study-status" id="activeStatus" aria-describedby="activeStatusHelp" title="Schematic data uses illustrative proportions.">SCHEMATIC</span><span class="sr-only" id="activeStatusHelp">Schematic data uses illustrative proportions.</span>') || !app.includes('const studyStatusDescription = (study) =>') || !app.includes('activeStatusHelp.textContent = studyStatusDescription(study);') || !app.includes('activeStatus.title = studyStatusDescription(study);')) throw new Error('Active study status must explain its provenance');
          if (!html.includes('id="analysisReading"')) throw new Error('Missing interpretive reading');
          if (!html.includes('id="profileRow" role="list" aria-label="Reading profile scores"')) throw new Error('Missing semantic reading-profile list');
          if (!html.includes('<details class="shortcut-guide">')) throw new Error('Missing keyboard shortcut guide');
          if (!html.includes('dimension line')) throw new Error('Missing clear schematic dimension label');
          for (const token of ['data-surface="exterior" type="button" aria-pressed="true" aria-controls="geometryCanvas"', 'data-mode="plan" type="button" aria-pressed="true" aria-controls="geometryCanvas"', 'data-layer="all" type="button" aria-pressed="true" aria-controls="geometryCanvas"']) {
            if (!html.includes(token)) throw new Error('Missing initial pressed state: ' + token);
          }
          if (!html.includes('aria-keyshortcuts="J"')) throw new Error('Missing keyboard shortcut metadata');
          for (const token of ['id="zoomReset" type="button" aria-label="Reset zoom to 100%" aria-controls="geometryCanvas"', 'id="resetDrawing" type="button" aria-label="Reset drawing to outside plan, all geometry, and 100% zoom" aria-controls="geometryCanvas"', 'id="zoomOut" type="button" aria-label="Zoom out" aria-controls="geometryCanvas"', 'id="zoomIn" type="button" aria-label="Zoom in" aria-controls="geometryCanvas"', 'id="zoomReadout" role="status" aria-live="polite"', 'id="catalogResultCount" role="status" aria-live="polite" aria-atomic="true" aria-label="06 of 06 studies; the full collection."']) {
            if (!html.includes(token)) throw new Error(`Missing accessible zoom control: ${token}`);
          }
          if (!app.includes('const MIN_ZOOM = 0.7;') || !app.includes('const MAX_ZOOM = 1.6;') || !app.includes('zoomOut.disabled = state.zoom <= MIN_ZOOM;') || !app.includes('zoomIn.disabled = state.zoom >= MAX_ZOOM;') || !app.includes('Zoom out (minimum 70%)') || !app.includes('Zoom in (maximum 160%)') || !styles.includes('.zoom-control button:disabled')) throw new Error('Zoom limits must expose disabled endpoint controls');
          if (!app.includes('$("#metricLength").textContent = `${number(study.length)} m`;') || !styles.includes('.metric-strip { display: grid; grid-template-columns: repeat(5, 1fr);') || !styles.includes('.metric-cell:nth-child(even)') || !styles.includes('.metric-cell:nth-child(-n + 4)')) throw new Error('Overall length metric must render and reflow responsively');
          if (!html.includes('id="downloadDrawing" type="button" aria-label="Export the current drawing as SVG"')) throw new Error('Missing accessible drawing export label');
          if (!html.includes('<span class="sr-only" id="drawingDownloadStatus" role="status" aria-live="polite"></span>')) throw new Error('Drawing export must have a nearby live status channel');
          const drawingExportStart = app.indexOf('function downloadDrawing()');
          const drawingExportEnd = app.indexOf('\n  function downloadStudy()', drawingExportStart);
          const drawingExport = app.slice(drawingExportStart, drawingExportEnd);
          if (drawingExportStart < 0 || drawingExportEnd < 0 || !drawingExport.includes('const status = $("#drawingDownloadStatus");') || drawingExport.includes('const status = $("#downloadStatus");')) throw new Error('Drawing export must announce completion through its dedicated status channel');
          if (!html.includes('id="downloadData" type="button" aria-label="Download full atlas data as JSON"')) throw new Error('Missing accessible full-data download label');
          if (!html.includes('id="downloadStudy" type="button" aria-label="Download active study as JSON"')) throw new Error('Missing accessible study-data download label');
          if (!html.includes('id="shareStudy" type="button" aria-label="Share current study"')) throw new Error('Missing accessible study share label');
          if (!html.includes('id="copyCitation" type="button" aria-label="Copy a citation for the active study"')) throw new Error('Missing accessible citation label');
          if (!html.includes('id="printStudy" type="button" aria-label="Print active study sheet"')) throw new Error('Missing accessible print control');
          if (!html.includes('id="downloadCatalogView" type="button" aria-label="Export current catalog view as JSON"')) throw new Error('Missing catalog export control');
          if (!html.includes('id="shareCatalog" type="button" aria-label="Share current catalog view"')) throw new Error('Missing catalog share control');
          if (!html.includes('id="shareCompare" type="button" aria-label="Share this comparison"')) throw new Error('Missing comparison share control');
          if (!html.includes('id="clearCompare" type="button" aria-label="Clear comparison selection"') || !html.includes('id="openCompare" type="button" aria-controls="compareView" aria-label="Compare selected studies (select at least two)"')) throw new Error('Comparison tray controls must have useful initial labels');
          for (const token of ['const selectedLabel = `${selectedCount} selected ${selectedCount === 1 ? "study" : "studies"}`;', 'open.setAttribute("aria-label", compareLabel);', 'clear.setAttribute("aria-label", clearLabel);']) {
            if (!app.includes(token)) throw new Error('Comparison tray labels must reflect selection state: ' + token);
          }
          if (!html.includes('<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">')) throw new Error('Brand mark must be hidden from assistive technology');
          for (const token of ['<span class="card-symbol" aria-hidden="true">□</span>', '<span class="card-symbol" aria-hidden="true">↔</span>', '<span class="card-symbol" aria-hidden="true">↕</span>', '<span class="card-symbol" aria-hidden="true">∷</span>', '<span class="footer-mark" aria-hidden="true">✳</span>']) {
            if (!html.includes(token)) throw new Error('Decorative symbol must be hidden from assistive technology: ' + token);
          }
          if (!html.includes('<svg viewBox="0 0 360 260" role="img" focusable="false">')) throw new Error('Missing decorative method SVG focus guard');
          if (!app.includes('class="catalog-glyph" viewBox="0 0 40 40" aria-hidden="true" focusable="false"')) throw new Error('Missing catalog glyph focus guard');
          if (!app.includes('data-compare-study="${escapeHtml(study.id)}" type="button" aria-controls="atlas"')) throw new Error('Missing comparison study destination relationship');
          for (const token of ['function comparisonStudyAriaLabel', 'Dimensions:', 'study.typology)} study at', 'studyStatus(study))}.', 'with a span of ${number(study.span)} meters']) {
            if (!app.includes(token)) throw new Error('Comparison study labels must retain context: ' + token);
          }
          if (app.includes('meters wide')) throw new Error('Comparison study labels must use span terminology');
          if (!app.includes('role="img" aria-labelledby="drawing-title drawing-description" focusable="false"')) throw new Error('Drawing SVG must not become keyboard focusable');
          for (const token of ['role="img" aria-labelledby="drawing-title drawing-description"', 'Overall dimensions are', 'Envelope:', 'Reading:', 'Reference:']) {
            if (!app.includes(token)) throw new Error('Missing accessible drawing description: ' + token);
          }
          for (const token of ['const studySurfaceReading = (study) =>', '$("#activeDescription").textContent = studySurfaceReading(study)', '$("#analysisReading").textContent = studySurfaceReading(study)', 'const reading = studySurfaceReading(study);', 'Reading: ${reading || "No interpretive reading supplied."}']) {
            if (!app.includes(token)) throw new Error('Drawing caption and SVG description must share the active surface reading: ' + token);
          }
          for (const token of ['const layerDisplayNames = {', 'measure: "dimensions"', 'const layerDisplayName = (layer) =>', 'const layerFocusLabel = () =>', 'layerFocusLabel()', 'layerDisplayName(state.layer)']) {
            if (!app.includes(token)) throw new Error('Missing human-readable geometry layer label: ' + token);
          }
          if (!html.includes('<table class="comparison-table" id="comparisonDataTable">')) throw new Error('Missing semantic comparison table');
          if (!html.includes('id="downloadComparison" type="button" aria-label="Download comparison data as CSV"') || !html.includes('id="comparisonDownloadStatus" role="status" aria-live="polite"')) throw new Error('Missing accessible comparison CSV export');
          if (!app.includes('function csvCell(value)') || !app.includes('function comparisonCsvPayload(comparison)') || !app.includes('text/csv;charset=utf-8') || !app.includes('sacred-geometry-comparison.csv') || !app.includes('temporaryButtonFeedback(button, "Downloaded", "Comparison CSV downloaded"')) throw new Error('Missing comparison CSV export behavior');
          for (const token of ['R = L ÷ span', 'length-to-span ratio', '<small>L × span</small>', '<small>H ÷ span</small>', '<small>M ÷ span</small>', 'R = L ÷ span = ${number(ratio, 2)}']) {
            if (!html.includes(token) && !app.includes(token)) throw new Error('Proportion notation must use span consistently: ' + token);
          }
          for (const token of ['R = L ÷ W', 'length-to-width ratio', 'L × W', 'H ÷ W', 'M ÷ W']) {
            if (html.includes(token) || app.includes(token)) throw new Error('Stale width-based proportion notation remains: ' + token);
          }
          for (const token of ['<th scope="col">Length (m)</th>', '<th scope="col">Length ÷ span</th>', '<th scope="col">Height ÷ span</th>', '<th scope="col">Bay count</th>', '<th scope="col">Module (m)</th>', '<th scope="col">Symmetry index</th>']) {
            if (!html.includes(token)) throw new Error('Comparison table header is missing clear units or meaning: ' + token);
          }
          if (!html.includes('<span class="sr-only" id="comparisonTableHelp">When the table is focused, use the Left and Right Arrow keys or Home and End to scroll horizontally.</span>') || !html.includes('<div class="comparison-table-wrap" tabindex="0" role="region" aria-label="Scrollable schematic comparison table" aria-describedby="comparisonTableHelp" aria-keyshortcuts="ArrowLeft ArrowRight Home End">')) throw new Error('Comparison table must expose keyboard scrolling instructions');
          if (!styles.includes('.comparison-table thead th:first-child, .comparison-table tbody th { position: sticky;') || !styles.includes('box-shadow: 1px 0 0 var(--line);')) throw new Error('Comparison table must keep study labels visible while scrolling');
          if (!app.includes('function handleComparisonTableKey(event)') || !app.includes('comparisonTable.addEventListener("keydown", handleComparisonTableKey)') || !app.includes('target.scrollBy({ left: delta, behavior })') || !app.includes('target.scrollTo({ left, behavior })')) throw new Error('Comparison table keyboard scrolling behavior is missing');
          if (!html.includes('id="compareCount" role="status" aria-live="polite"')) throw new Error('Missing live comparison count');
          if (!html.includes('<div class="svg-wrap" id="geometryCanvas"></div>')) throw new Error('Drawing canvas must use the dedicated status channel');
          if (!html.includes('<span class="sr-only" id="keyboardStatus" role="status" aria-live="polite"></span>')) throw new Error('Missing drawing status channel');
          if (!styles.includes('.comparison-table-wrap:focus-visible')) throw new Error('Comparison table region must have a visible focus state');
          if (!html.includes('id="activeName" tabindex="-1"')) throw new Error('Missing focusable active study heading');
          for (const token of ['class="noscript-number" aria-hidden="true"', 'class="study-index" id="activeIndex" aria-hidden="true"', 'class="method-card-index" aria-hidden="true"', 'class="note-icon" aria-hidden="true"']) {
            if (!html.includes(token)) throw new Error('Missing decorative marker guard: ' + token);
          }
          if (!app.includes('<span class="catalog-number" aria-hidden="true">')) throw new Error('Missing catalog number guard');
          if (!app.includes('function studySearchText(study)') || !app.includes('study.details.flat()')) throw new Error('Catalog search must cover full study text');
          if (!html.includes('<label class="sr-only" for="searchInput">Search geometry studies</label>') || !html.includes('id="searchHelp"') || !html.includes('geometry dimensions') || !html.includes('Press Escape to clear the current search.') || !html.includes('aria-describedby="searchHelp"') || !html.includes('aria-keyshortcuts="/ Escape"') || !html.includes('spellcheck="false"') || !html.includes('autocapitalize="none"')) throw new Error('Missing catalog search instructions');
          if (!html.includes('<kbd>/</kbd>') || !html.includes('Focus study search') || !html.includes('<kbd>Esc</kbd>') || !html.includes('Clear search when focused')) throw new Error('Missing search keyboard shortcut guidance');
          if (!app.includes('function handleSearchKeydown(event)') || !app.includes('$("#searchInput").addEventListener("keydown", handleSearchKeydown)') || !app.includes('event.key !== "Escape"') || !app.includes('clearButton.click()')) throw new Error('Missing Escape-to-clear search behavior');
          if (!app.includes('const dimensions = [') || !app.includes('`length ${study.length} m`') || !app.includes('`length ${number(study.length)} m`') || !app.includes('`${study.bayCount} bays`') || !app.includes('`symmetry ${number(study.symmetry, 2)}`') || !app.includes('floor area ${number(study.floorAreaEstimate, 0)} m²')) throw new Error('Catalog search must include labeled geometry dimensions');
          if (!styles.includes('.search-field input::-webkit-search-cancel-button') || !styles.includes('.search-field input::-ms-clear')) throw new Error('Search field must expose one consistent clear affordance');
          for (const token of ['<li class="catalog-entry">', 'data-clear-filters', 'catalog-card-title', 'compare-study-title', 'Length to span ratio', 'function catalogStudyAriaLabel(study, isActive)', 'catalogStudyAriaLabel(study, isActive)', 'study.place', 'number(study.length)} meters long, span', 'if (state.sort !== "index") filters.push({ key: "sort", label: `Sort: ${$("#sortSelect").selectedOptions[0].textContent}` });', 'sort: "#sortSelect"', 'if (key === "sort")', 'selectStudy(card.dataset.studyId, { focus: event.detail === 0, restoreCardFocus: true })', 'selectStudy(studyCard.dataset.compareStudy, { focus: event.detail === 0, restoreCardFocus: true })', 'toggleCompare(compareToggle.dataset.compareId, { focus: true })', 'announceStudy(activeStudy(), visible.length)', 'function focusCatalogControl(key, options = {})', 'const { preventScroll = true } = options;', 'control.focus({ preventScroll })', 'focusCatalogControl(key)', 'clearFilter("query", { focus: true })', 'clearCatalogFilters({ resetSort: true, focus: true })', 'clearFilter(chip.dataset.clearFilter, { focus: true })', 'if (focus) focusCatalogControl("query")', 'focusCompareToggle(id)', 'focusStudyCard(id)', 'focusCatalogControl("query", { preventScroll: false });']) {
            if (!app.includes(token)) throw new Error(`Missing accessible catalog structure: ${token}`);
          }
          if (!app.includes('window.addEventListener("popstate", syncFromHash)')) throw new Error('Missing browser history navigation support');
          if (!app.includes('const previousPage = state.page;') || !app.includes('else if (window.location.hash.length > 0 && previousPage === route.page)') || !app.includes('function focusPageHeading(page, preventScroll = true)')) throw new Error('Same-view hash navigation must restore heading focus');
          if (!app.includes('const visibleCount = String(count).padStart(2, "0");') || !app.includes('const totalCount = String(studies.length).padStart(2, "0");')) throw new Error('Catalog result counts must preserve two-digit formatting');
          if (!app.includes('function renderCatalogResultCount(count)') || !app.includes('renderCatalogResultCount(visible.length);') || !app.includes('let lastCatalogStatus = "";') || !app.includes('let lastCatalogResultCount = "";') || !app.includes('const scopeLabel = `${text}; ${catalogScopeLabel()}.`;') || !app.includes('lastCatalogResultCount === text') || !app.includes('liveStatus.textContent = "";') || !app.includes('Catalog updated: ${scopeLabel}')) throw new Error('Catalog scope changes must be announced without duplicating count updates');
          const refreshStart = app.indexOf('function refreshCatalog()');
          const refreshEnd = app.indexOf('\n  function renderAll()', refreshStart);
          if (refreshStart < 0 || refreshEnd < 0 || app.slice(refreshStart, refreshEnd).includes('renderCatalogResultCount(')) throw new Error('Catalog refresh must announce its result count only through renderList');
          for (const token of ['function setButtonFeedback(button, visibleLabel, accessibleLabel)', 'setButtonFeedback(button, "Link copied", "Share link copied");', 'setButtonFeedback(button, "Link copied", "Catalog view link copied");', 'setButtonFeedback(button, "Link copied", "Comparison link copied");', 'setButtonFeedback(button, "Citation copied", "Citation copied");']) {
            if (!app.includes(token)) throw new Error('Copy feedback must synchronize visible and accessible labels: ' + token);
          }
          if (!app.includes('try {\n        await navigator.clipboard.writeText(value);\n        return true;\n      } catch (error) {\n        // Continue with the textarea fallback if the permissioned API rejects.') || !app.includes('const previousFocus = document.activeElement;') || !app.includes('previousFocus.focus({ preventScroll: true });')) throw new Error('Copy fallback must handle clipboard rejection and restore initiating focus');
          for (const token of ['function temporaryButtonFeedback(button, visibleLabel, accessibleLabel, resetVisibleLabel, resetAccessibleLabel, key)', 'button.classList.add("is-complete")', 'temporaryButtonFeedback(button, "Exported", "Drawing exported"', 'temporaryButtonFeedback(button, "Downloaded", "Study JSON downloaded"', 'temporaryButtonFeedback(button, "Downloaded", "Atlas data downloaded"', 'temporaryButtonFeedback(button, "Exported", "Catalog view exported"']) {
            if (!app.includes(token)) throw new Error('Download actions must expose completion feedback: ' + token);
          }
          for (const token of ['.download-button.is-complete', '.drawing-export.is-complete', '.share-button.is-complete']) {
            if (!styles.includes(token)) throw new Error('Download completion state is missing styling: ' + token);
          }
          for (const token of ['aria-label="${escapeHtml(studyShortName(study))}: length to span ratio ${number(ratio, 2)}"', 'aria-label="${escapeHtml(studyShortName(study))}: height to span ratio ${number(ratio, 2)}"']) {
