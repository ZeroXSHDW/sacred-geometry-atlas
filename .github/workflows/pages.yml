          if (!app.includes('const revealPending = document.body.classList.contains("no-js");') || !app.includes('previousPage === route.page || revealPending') || !app.includes('pageChanged && !document.body.classList.contains("no-js")')) throw new Error('Initial deep-link focus must wait until the app is visible');
