            if (customStatusResult.status !== 0) throw new Error(customStatusResult.stderr || customStatusResult.stdout || 'Custom-status no-script generation failed');
            const customStatusGenerated = fs.readFileSync(path.join(temporaryRoot, 'index.html'), 'utf8');
            const customStatusCsv = fs.readFileSync(path.join(temporaryRoot, 'data/geometry.csv'), 'utf8');
            if (!customStatusGenerated.includes('Six schematic and estimated studies') || !customStatusGenerated.includes('Estimated = Proportional estimate pending source review.') || !customStatusGenerated.includes('5 schematic · 1 estimated')) {
              throw new Error('Generated no-script fallback did not preserve a schema-defined custom status');
            }
            if (!customStatusCsv.includes('"estimated","Proportional estimate pending source review."')) throw new Error('Generated CSV did not preserve a schema-defined custom status');
            const noteSource = fs.readFileSync('data/geometry.js', 'utf8')
              .replace('note: "The current collection is a schematic proportional study, not a measured survey or a claim about every church."', 'note: "Custom <note> disclaimer."');
            fs.writeFileSync(sourcePath, noteSource);
            const noteResult = spawnSync(process.execPath, ['scripts/sync-geometry-json.js'], { cwd: temporaryRoot, encoding: 'utf8' });
            if (noteResult.status !== 0) throw new Error(noteResult.stderr || noteResult.stdout || 'Custom-note no-script generation failed');
            const noteGenerated = fs.readFileSync(path.join(temporaryRoot, 'index.html'), 'utf8');
