      - name: Smoke-test comparison printing
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const panel = { open: false };
          const keyboardStatus = { textContent: '' };
          const classes = new Set();
          const createPrintButton = () => {
            const label = { textContent: '' };
            const attributes = {};
            return {
              attributes,
              classList: { add(name) { classes.add(name); }, remove(name) { classes.delete(name); } },
              querySelector() { return label; },
              setAttribute(name, value) { attributes[name] = value; },
              label,
              title: ''
            };
          };
          const printComparisonButton = createPrintButton();
          const printStudyButton = createPrintButton();
          let printCalls = 0;
          let afterPrint;
          const context = {
            URL,
            window: {
              location: { href: 'https://example.test/atlas/#compare/basilica,gothic' },
              print() { printCalls += 1; },
              setTimeout() { return 1; },
              clearTimeout() {},
              addEventListener(name, listener) { if (name === 'afterprint') afterPrint = listener; },
              removeEventListener(name, listener) { if (name === 'afterprint' && listener === afterPrint) afterPrint = null; }
            },
            document: {
              body: { classList: { add(name) { classes.add(name); }, remove(name) { classes.delete(name); } } },
              querySelector(selector) {
                if (selector === '.comparison-table-panel') return panel;
                if (selector === '#keyboardStatus') return keyboardStatus;
                if (selector === '#printComparison') return printComparisonButton;
                if (selector === '#printStudy') return printStudyButton;
                return null;
              },
              querySelectorAll() { return []; }
            }
          };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { state, printComparison, printStudy } ;\n})();');
          vm.runInNewContext(app, context);
          const { state, printComparison, printStudy } = context.window.__atlasTest;
          state.compareIds = ['basilica', 'gothic'];
          printComparison();
          if (printCalls !== 1 || !classes.has('print-comparison') || classes.has('is-unavailable') || !panel.open || keyboardStatus.textContent !== 'Printing the comparison for 2 selected studies.' || printComparisonButton.label.textContent !== 'Print opened' || printComparisonButton.attributes['aria-label'] !== 'Print dialog opened for 2 selected studies' || typeof afterPrint !== 'function') throw new Error('Comparison printing did not prepare its scoped print state or visible feedback');
          afterPrint();
          if (classes.has('print-comparison') || panel.open || afterPrint !== null) throw new Error('Comparison printing did not restore the interactive state after printing');
          context.window.print = () => { throw new Error('Print dialog blocked'); };
          state.compareIds = [];
          printStudy();
          if (keyboardStatus.textContent !== 'Printing is unavailable in this browser.' || !classes.has('is-unavailable') || printStudyButton.label.textContent !== 'Unavailable' || printStudyButton.attributes['aria-label'] !== 'Printing is unavailable in this browser.') throw new Error('Study printing did not recover from a blocked print dialog with visible feedback');
          console.log('Study and comparison printing smoke test passed.');
          NODE

