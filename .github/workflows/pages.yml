      - name: Smoke-test hero provenance summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const elements = new Map([
            ['#heroDataNote', { attributes: {}, setAttribute(name, value) { this.attributes[name] = value; } }],
            ['#heroDataNoteText', { textContent: '' }],
            ['#heroDataNoteDefinition', { textContent: '' }]
          ]);
          const context = {
            console,
            window: {},
            document: {
              querySelector(selector) { return elements.get(selector) || null; },
              querySelectorAll() { return []; }
            }
          };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { renderHeroProvenance };\n})();');
          vm.runInNewContext(app, context);
          const { renderHeroProvenance } = context.window.__atlasTest;
          renderHeroProvenance();
          if (elements.get('#heroDataNoteText').textContent !== '06 schematic · 00 measured' || elements.get('#heroDataNoteDefinition').textContent !== 'Schematic = Illustrative proportions; not a measured survey.' || elements.get('#heroDataNote').attributes['data-status'] !== 'schematic') throw new Error('Hero provenance summary did not expose the current schema-backed status counts, definition, and state cue');
          context.window.CHURCH_GEOMETRY[0].status = 'measured';
          context.window.CHURCH_GEOMETRY_SCHEMA.statusDefinitions.measured = 'Custom measured definition.';
          renderHeroProvenance();
          if (elements.get('#heroDataNoteText').textContent !== '05 schematic · 01 measured' || elements.get('#heroDataNoteDefinition').textContent !== 'Schematic = Illustrative proportions; not a measured survey. Measured = Custom measured definition.' || elements.get('#heroDataNote').attributes['data-status'] !== 'mixed' || !elements.get('#heroDataNote').attributes['aria-label'].includes('Measured = Custom measured definition.')) throw new Error('Hero provenance summary did not follow a changed record status, schema definition, or mixed-state cue');
