      - name: Audit HTML accessibility references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree

          class AccessibilityAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.references = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  for key in ("aria-labelledby", "aria-describedby", "aria-controls", "aria-owns"):
                      if key in attrs:
                          self.references.extend(attrs[key].split())

          parser = AccessibilityAudit()
          parser.feed(Path("index.html").read_text())
          if len(parser.ids) != len(set(parser.ids)):
              raise SystemExit("Duplicate HTML IDs found")
          missing = sorted(set(parser.references) - set(parser.ids))
          if missing:
              raise SystemExit("Missing ARIA references: " + ", ".join(missing))
          sitemap_root = ElementTree.parse("sitemap.xml").getroot()
          sitemap_namespace = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          if sitemap_root.tag != f"{sitemap_namespace}urlset" or not sitemap_root.findall(f"{sitemap_namespace}url"):
              raise SystemExit("Sitemap must contain at least one URL entry")
          print(f"Accessibility reference audit passed: {len(parser.ids)} unique IDs.")
          PY
