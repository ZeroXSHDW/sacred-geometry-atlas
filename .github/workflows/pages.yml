            if (unitResult.status !== 0) throw new Error(unitResult.stderr || unitResult.stdout || 'Custom-unit no-script generation failed');
            const unitGenerated = fs.readFileSync(path.join(temporaryRoot, 'index.html'), 'utf8');
            const unitCsv = fs.readFileSync(path.join(temporaryRoot, 'data/geometry.csv'), 'utf8');
