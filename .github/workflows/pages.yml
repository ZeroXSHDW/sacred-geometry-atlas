            statusValues: [...context.window.CHURCH_GEOMETRY_SCHEMA.statusValues, 'estimated <review>'],
            statusDefinitions: {
              ...context.window.CHURCH_GEOMETRY_SCHEMA.statusDefinitions,
              'estimated <review>': 'Proportional estimate <pending review>.'
            }
          };
          context.window.CHURCH_GEOMETRY = context.window.CHURCH_GEOMETRY.map((study, index) => index === 0 ? { ...study, status: 'estimated <review>' } : study);
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { renderComparisonTable, renderCharts, renderProfileCompare };\n})();');
          vm.runInNewContext(app, context);
          const { renderComparisonTable, renderCharts, renderProfileCompare } = context.window.__atlasTest;
          renderComparisonTable();
          renderCharts();
          renderProfileCompare();
          const table = elements.get('#comparisonTableBody').innerHTML;
          const moduleChart = elements.get('#moduleChart').innerHTML;
          const ratioChart = elements.get('#ratioChart').innerHTML;
          const profileChart = elements.get('#profileCompare').innerHTML;
          if (!table.includes('&lt;unit&gt;') || table.includes('<unit>') || !moduleChart.includes('&lt;unit&gt;') || moduleChart.includes('<unit>')) throw new Error('Schema unit symbols must remain escaped in HTML comparison surfaces');
          if (!ratioChart.includes('estimated &lt;review&gt;') || ratioChart.includes('<review>') || ratioChart.includes('<pending review>') || !profileChart.includes('estimated &lt;review&gt;') || profileChart.includes('<review>') || profileChart.includes('<pending review>')) throw new Error('Custom schema status text must remain escaped in comparison chart markup');
          console.log('Escaped schema units in comparison surfaces smoke test passed.');
          NODE
      - name: Smoke-test active study measure summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const elements = new Map();
          const makeElement = () => ({
            hidden: false,
            textContent: '',
            innerHTML: '',
            value: '',
            title: '',
            setAttribute() {},
            removeAttribute() {},
            querySelector() { return makeElement(); }
          });
          const context = {
            URL,
            window: {
              location: { href: 'https://example.test/atlas/#atlas/basilica/plan/exterior/all', hash: '#atlas/basilica/plan/exterior/all' },
              addEventListener() {}
            },
            document: {
              title: '',
              querySelector(selector) {
                if (!elements.has(selector)) elements.set(selector, makeElement());
                return elements.get(selector);
              },
              querySelectorAll() { return []; }
            }
          };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          context.window.CHURCH_GEOMETRY_SCHEMA = { ...context.window.CHURCH_GEOMETRY_SCHEMA, units: 'feet', unitSymbol: 'ft' };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { renderStudy };\n})();');
          vm.runInNewContext(app, context);
          context.window.__atlasTest.renderStudy();
          const profileMarkup = elements.get('#profileRow').innerHTML;
          if (elements.get('#activeMeasureVisible').textContent !== 'Envelope · 58 × 22 × 18 ft · radius 11 ft' || elements.get('#activeMeasureAccessible').textContent !== 'Envelope dimensions: 58.0 feet long, span 22.0 feet, height 18.0 feet; primary radius 11.0 feet.' || elements.get('#analysisAreaLabel').textContent !== 'floor area estimate' || elements.get('#analysisAreaBasis').textContent !== 'supplied floor-area estimate' || !profileMarkup.includes('aria-label="Longitudinal basilica linearity interpretive score"') || !profileMarkup.includes('aria-valuetext="47 out of 100; normalized length ÷ span; interpretive, not empirical measurement"') || !profileMarkup.includes('aria-valuetext="68 out of 100; normalized height ÷ span; interpretive, not empirical measurement"')) throw new Error('Active study measure summary did not expose explicit schema-backed units, study identity, floor-area provenance, and measurement-specific interpretive profile meter context');
          const originalFloorArea = context.window.CHURCH_GEOMETRY[0].floorAreaEstimate;
          context.window.CHURCH_GEOMETRY[0].floorAreaEstimate = undefined;
          context.window.__atlasTest.renderStudy();
          context.window.CHURCH_GEOMETRY[0].floorAreaEstimate = originalFloorArea;
          if (elements.get('#analysisAreaLabel').textContent !== 'bounding area' || elements.get('#analysisAreaBasis').textContent !== 'length × span fallback') throw new Error('Active study measure summary did not label the floor-area fallback');
          console.log('Active study measure summary smoke test passed.');
          NODE

      - name: Smoke-test route-preserving runtime recovery
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scriptMatch = html.match(/<script>\s*document\.body\.classList\.add\("js-runtime"\);[\s\S]*?<\/script>/);
          if (!scriptMatch) throw new Error('Could not isolate the runtime marker script');
          const script = scriptMatch[0].replace(/^<script>|<\/script>$/g, '');
          const route = 'https://example.test/sacred-geometry-atlas/?q=axis&compare=basilica%2Cgothic#compare/basilica,gothic';
          const runtimeAnchor = { href: './' };
          const dataAnchor = { href: './' };
          const classNames = [];
          const context = {
            window: { location: { href: route } },
            document: {
              body: { classList: { add(name) { classNames.push(name); } } },
              querySelectorAll(selector) { return selector === '[data-recovery-reload]' ? [runtimeAnchor, dataAnchor] : []; }
            }
          };
          vm.runInNewContext(script, context);
          if (!classNames.includes('js-runtime') || runtimeAnchor.href !== route || dataAnchor.href !== route) throw new Error('Runtime marker did not preserve the current route before deferred boot');
          console.log('Immediate route-preserving runtime recovery smoke test passed.');
          NODE

      - name: Smoke-test export scope announcements
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { exportCompletionScope };\n})();');
          vm.runInNewContext(app, context);
          const { exportCompletionScope } = context.window.__atlasTest;
          if (exportCompletionScope(context.window.CHURCH_GEOMETRY, 'full collection') !== 'Scope: full collection; 6 studies') throw new Error('Full-collection export announcement lost its count or scope');
          if (exportCompletionScope(context.window.CHURCH_GEOMETRY.slice(0, 1), 'results matching “gothic”') !== 'Scope: results matching “gothic”; 1 study') throw new Error('Filtered export announcement did not use singular count or exact scope');
          console.log('Export scope announcement smoke test passed.');
          NODE

      - name: Smoke-test guarded download fallback
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          let appended = 0;
          let removed = 0;
          let revoked = 0;
          class TestBlob {
            constructor(parts, options) {
              this.parts = parts;
              this.type = options.type;
            }
          }
          class TestUrl {
            static createObjectURL(blob) {
              if (!(blob instanceof TestBlob)) throw new Error('Expected a Blob payload');
              return 'blob:test';
            }
            static revokeObjectURL(url) {
              if (url === 'blob:test') revoked += 1;
            }
          }
          const context = {
            Blob: TestBlob,
            URL: TestUrl,
            window: {
              CHURCH_GEOMETRY: [],
              setTimeout() { throw new Error('Failed downloads must not schedule cleanup'); }
            },
            document: {
              body: { classList: { remove() {} }, appendChild() { appended += 1; } },
              createElement() {
                return { remove() { removed += 1; } };
              },
              querySelector() { return null; },
              querySelectorAll() { return []; }
            }
          };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { triggerDownload, safeDownloadPart };\n})();');
          vm.runInNewContext(app, context);
          const downloaded = context.window.__atlasTest.triggerDownload('test.json', '{}', 'application/json');
          if (downloaded || appended !== 1 || removed !== 1 || revoked !== 1) throw new Error('Guarded download did not recover from missing anchor activation');
          if (context.window.__atlasTest.safeDownloadPart('../St. Paul\'s: nave?') !== 'St-Pauls-nave' || context.window.__atlasTest.safeDownloadPart('///') !== 'study') throw new Error('Generated download filenames must normalize unsafe dataset IDs');
          console.log('Guarded download fallback smoke test passed.');
          NODE

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          site = Path("_site")
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()
          (site / "data").mkdir()

          public_files = [
              Path(".nojekyll"),
              Path("404.html"),
              Path("app.js"),
              Path("favicon.svg"),
              Path("index.html"),
              Path("og.png"),
              Path("robots.txt"),
              Path("sitemap.xml"),
              Path("styles.css"),
          ]
          custom_domain = Path("CNAME")
          if custom_domain.exists() and not custom_domain.is_file():
              raise SystemExit("CNAME must be a file when present")
          if custom_domain.is_file():
              public_files.append(custom_domain)
          data_files = [
              Path("data/geometry.csv"),
              Path("data/geometry.js"),
              Path("data/geometry.json"),
              Path("data/geometry.schema.json"),
          ]
          for source in public_files:
              shutil.copy2(source, site / source.name)
          for source in data_files:
              shutil.copy2(source, site / source)

          expected = {
              ".nojekyll",
              "404.html",
              "app.js",
              "favicon.svg",
              "index.html",
              "og.png",
              "robots.txt",
              "sitemap.xml",
              "styles.css",
              "data/geometry.csv",
              "data/geometry.js",
              "data/geometry.json",
              "data/geometry.schema.json",
          }
          if custom_domain.is_file():
              expected.add("CNAME")
          actual = {path.relative_to(site).as_posix() for path in site.rglob("*") if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected Pages artifact contents: {sorted(actual)}")
          print(f"Prepared curated Pages artifact with {len(actual)} public files.")
          PY
      - name: Stamp deployed site metadata
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/") + "/"
          dataset_url = html.escape(base_url + "data/geometry.json", quote=True)
          csv_url = html.escape(base_url + "data/geometry.csv", quote=True)
          schema_target = base_url + "data/geometry.schema.json"
          schema_url = html.escape(schema_target, quote=True)
          site = Path("_site")
          page = site / "index.html"
          source = page.read_text()
          replacements = {
              '<link rel="canonical" href="./" />': f'<link rel="canonical" href="{html.escape(base_url, quote=True)}" />',
              '<meta property="og:url" content="./" />': f'<meta property="og:url" content="{html.escape(base_url, quote=True)}" />',
              '<meta property="og:image" content="og.png" />': f'<meta property="og:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
              '<meta name="twitter:image" content="og.png" />': f'<meta name="twitter:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
              '"@id": "data/geometry.json"': f'"@id": "{dataset_url}"',
              '"contentUrl": "data/geometry.json"': f'"contentUrl": "{dataset_url}"',
              '"contentUrl": "data/geometry.csv"': f'"contentUrl": "{csv_url}"',
              '"contentUrl": "data/geometry.schema.json"': f'"contentUrl": "{schema_url}"',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Missing repository-relative metadata: {old}")
              source = source.replace(old, new)
          page.write_text(source)

          dataset = site / "data/geometry.json"
          dataset_source = dataset.read_text()
          dataset_marker = '"schemaUrl": "data/geometry.schema.json"'
          if dataset_marker not in dataset_source:
              raise SystemExit(f"Missing repository-relative dataset schema URL: {dataset_marker}")
          dataset.write_text(dataset_source.replace(dataset_marker, f'"schemaUrl": "{schema_target}"', 1))

          csv = site / "data/geometry.csv"
          csv_source = csv.read_text()
          csv_marker = '"data/geometry.schema.json"'
          if csv_marker not in csv_source:
              raise SystemExit(f"Missing repository-relative CSV schema URL: {csv_marker}")
          csv.write_text(csv_source.replace(csv_marker, f'"{schema_target}"'))

          schema = site / "data/geometry.schema.json"
          schema_source = schema.read_text()
          schema_replacements = {
              '"$id": "./geometry.schema.json"': f'"$id": "{schema_target}"',
              '"const": "data/geometry.schema.json"': f'"const": "{schema_target}"',
          }
          for old, new in schema_replacements.items():
              if old not in schema_source:
                  raise SystemExit(f"Missing repository-relative schema metadata: {old}")
              schema_source = schema_source.replace(old, new, 1)
          schema.write_text(schema_source)

          not_found = site / "404.html"
          not_found_source = not_found.read_text()
          not_found_replacements = {
              '<a class="home-link" data-site-root href="../">': f'<a class="home-link" data-site-root href="{html.escape(base_url, quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-dataset href="data/geometry.json">': f'<a class="home-link home-link-secondary" data-site-dataset href="{html.escape(base_url + "data/geometry.json", quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-csv href="data/geometry.csv">': f'<a class="home-link home-link-secondary" data-site-csv href="{html.escape(base_url + "data/geometry.csv", quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-schema href="data/geometry.schema.json">': f'<a class="home-link home-link-secondary" data-site-schema href="{schema_url}">',
          }
          for old, new in not_found_replacements.items():
              if old not in not_found_source:
                  raise SystemExit(f"Missing repository-relative 404 recovery link: {old}")
              not_found_source = not_found_source.replace(old, new)
          not_found.write_text(not_found_source)

          robots = site / "robots.txt"
          robots_source = robots.read_text()
          robots_marker = "Sitemap: ./sitemap.xml"
          robots_value = f"Sitemap: {html.escape(base_url + 'sitemap.xml', quote=True)}"
          if robots_marker not in robots_source:
              raise SystemExit(f"Missing repository-relative crawl marker: {robots_marker}")
          robots.write_text(robots_source.replace(robots_marker, robots_value))

          sitemap = site / "sitemap.xml"
          sitemap_source = sitemap.read_text()
          sitemap_markers = {
              "<loc>./</loc>": f"<loc>{html.escape(base_url, quote=True)}</loc>",
              "<loc>./data/geometry.json</loc>": f"<loc>{html.escape(base_url + 'data/geometry.json', quote=True)}</loc>",
              "<loc>./data/geometry.csv</loc>": f"<loc>{html.escape(base_url + 'data/geometry.csv', quote=True)}</loc>",
              "<loc>./data/geometry.schema.json</loc>": f"<loc>{html.escape(base_url + 'data/geometry.schema.json', quote=True)}</loc>",
          }
          for sitemap_marker, sitemap_value in sitemap_markers.items():
              if sitemap_marker not in sitemap_source:
                  raise SystemExit(f"Missing repository-relative sitemap marker: {sitemap_marker}")
              sitemap_source = sitemap_source.replace(sitemap_marker, sitemap_value)
          sitemap.write_text(sitemap_source)
          print(f"Stamped absolute Pages metadata and crawl URLs for {base_url}")
          PY
      - name: Verify curated Pages artifact
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/verify-pages-artifact.py
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
