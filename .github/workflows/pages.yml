          const makeFallback = () => {
            const panel = { hidden: true };
            const text = {
              value: '',
              focused: false,
              selected: false,
              focus() { this.focused = true; },
              select() { this.selected = true; }
            };
            return { panel, text };
          };
          const catalogRouteFallback = makeFallback();
          const studyRouteFallback = makeFallback();
          const comparisonRouteFallback = makeFallback();
          const methodRouteFallback = makeFallback();
          elements.set('#catalogRouteFallback', catalogRouteFallback.panel);
          elements.set('#catalogRouteFallbackText', catalogRouteFallback.text);
          elements.set('#studyRouteFallback', studyRouteFallback.panel);
          elements.set('#studyRouteFallbackText', studyRouteFallback.text);
