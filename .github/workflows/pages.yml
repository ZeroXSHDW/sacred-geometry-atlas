          if (!html.includes('<main id="main-content" tabindex="-1">') || !html.includes('<h1 id="noscript-heading" tabindex="-1">') || !html.includes('id="runtimeFallback" role="main" aria-labelledby="runtimeFallbackHeading" tabindex="-1"') || !styles.includes('#main-content:focus-visible') || !styles.includes('#noscript-heading:focus-visible') || !styles.includes('#runtimeFallback:focus')) throw new Error('Skip-link destinations must be focusable and visibly styled');
