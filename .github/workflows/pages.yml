      - name: Smoke-test active study measure summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const elements = new Map();
          const makeElement = () => ({
            hidden: false,
            textContent: '',
            innerHTML: '',
            value: '',
            title: '',
            setAttribute() {},
            removeAttribute() {},
            querySelector() { return makeElement(); }
          });
          const context = {
            URL,
            window: {
              location: { href: 'https://example.test/atlas/#atlas/basilica/plan/exterior/all', hash: '#atlas/basilica/plan/exterior/all' },
              addEventListener() {}
            },
            document: {
              title: '',
              querySelector(selector) {
                if (!elements.has(selector)) elements.set(selector, makeElement());
                return elements.get(selector);
              },
              querySelectorAll() { return []; }
            }
          };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const study = context.window.CHURCH_GEOMETRY[0];
          const studyLabelHtml = String(study.shortName || study.name).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
          const radiality = { central: 100, baroque: 84, basilica: 48, gothic: 42, stave: 36, modern: 28 }[study.type] || 40;
          const profileValue = (key) => {
            const score = key === 'linearity'
              ? Math.round(Math.min(100, Math.max(0, (((study.length / study.span) - 1) / 3.5) * 100)))
              : key === 'verticality'
                ? Math.round(Math.min(100, Math.max(0, (study.height / study.span / 1.2) * 100)))
                : key === 'radiality'
                  ? radiality
                  : Math.round(Math.min(100, (study.bayCount / 8) * 100));
            const basis = { linearity: 'normalized length ÷ span', verticality: 'normalized height ÷ span', radiality: 'typology cue', repetition: 'normalized bay count' }[key];
            return `${score} out of 100; ${basis}; interpretive, not empirical measurement`;
          };
          context.window.CHURCH_GEOMETRY_SCHEMA = { ...context.window.CHURCH_GEOMETRY_SCHEMA, units: 'feet', unitSymbol: 'ft' };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { renderStudy };\n})();');
          vm.runInNewContext(app, context);
          context.window.__atlasTest.renderStudy();
          const profileMarkup = elements.get('#profileRow').innerHTML;
          if (elements.get('#activeMeasureVisible').textContent !== 'Envelope · ' + study.length + ' × ' + study.span + ' × ' + study.height + ' ft · radius ' + study.radius + ' ft' || elements.get('#activeMeasureAccessible').textContent !== 'Envelope dimensions: ' + Number(study.length).toFixed(1) + ' feet long, span ' + Number(study.span).toFixed(1) + ' feet, height ' + Number(study.height).toFixed(1) + ' feet; primary radius ' + Number(study.radius).toFixed(1) + ' feet.' || elements.get('#analysisAreaLabel').textContent !== 'bounding area' || elements.get('#analysisAreaBasis').textContent !== 'length × span fallback' || !profileMarkup.includes('aria-label="Study ' + study.index + ', ' + studyLabelHtml + ' linearity interpretive score"') || !profileMarkup.includes('aria-valuetext="' + profileValue('linearity') + '"') || !profileMarkup.includes('aria-valuetext="' + profileValue('verticality') + '"')) throw new Error('Active study measure summary did not expose explicit schema-backed units, indexed study identity, floor-area provenance, and measurement-specific interpretive profile meter context');
          const originalFloorArea = context.window.CHURCH_GEOMETRY[0].floorAreaEstimate;
          context.window.CHURCH_GEOMETRY[0].floorAreaEstimate = undefined;
          context.window.__atlasTest.renderStudy();
          context.window.CHURCH_GEOMETRY[0].floorAreaEstimate = originalFloorArea;
          if (elements.get('#analysisAreaLabel').textContent !== 'bounding area' || elements.get('#analysisAreaBasis').textContent !== 'length × span fallback') throw new Error('Active study measure summary did not label the floor-area fallback');
          console.log('Active study measure summary smoke test passed.');
