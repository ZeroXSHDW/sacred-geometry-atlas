          const fs = require('fs');
          const vm = require('vm');
          (async () => {
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const cacheEntries = new Map();
          const deletedCaches = [];
          let waiting = false;
          let claimed = false;
          let online = true;
          const response = (url, body = url) => ({
            ok: true,
            url,
            body,
            clone() {
              return response(this.url, this.body);
            }
          });
          const cache = {
            async addAll(urls) {
              urls.forEach((url) => cacheEntries.set(String(url), response(String(url))));
            },
            async put(request, value) {
              cacheEntries.set(typeof request === 'string' ? request : request.url, value);
            }
          };
          const cachesApi = {
            async open() {
              return cache;
            },
            async match(request) {
              return cacheEntries.get(typeof request === 'string' ? request : request.url) || null;
            },
            async keys() {
              return ['sacred-geometry-atlas-old', 'sacred-geometry-atlas-v2'];
            },
            async delete(key) {
              deletedCaches.push(key);
              return true;
            }
          };
          const handlers = {};
          const self = {
            registration: { scope: 'https://example.test/atlas/' },
            location: { origin: 'https://example.test' },
            clients: {
              async claim() {
                claimed = true;
              }
            },
            async skipWaiting() {
              waiting = true;
            },
            addEventListener(type, handler) {
              handlers[type] = handler;
            }
          };
          const context = {
            self,
            caches: cachesApi,
            URL,
            Response: { error() { return { ok: false, type: 'error' }; } },
            fetch: async (request) => {
              if (!online) throw new Error('offline');
              return response(request.url, 'network');
            }
          };
          vm.runInNewContext(fs.readFileSync('sw.js', 'utf8'), context);
          const dispatch = async (type, event) => {
            let lifecycle;
            let fetchResponse;
            handlers[type]({
              ...event,
              waitUntil(value) {
                lifecycle = value;
              },
              respondWith(value) {
                fetchResponse = value;
              }
            });
            if (lifecycle) await lifecycle;
            return fetchResponse ? await fetchResponse : null;
          };
          await dispatch('install', {});
          assert(waiting, 'service worker did not skip waiting');
          assert(cacheEntries.has('https://example.test/atlas/index.html'), 'app shell did not cache index');
          assert(cacheEntries.has('https://example.test/atlas/data/geometry.json'), 'app shell did not cache dataset');
          assert(cacheEntries.has('https://example.test/atlas/icons/atlas-180.png'), 'app shell did not cache the 180px Apple touch icon');
          assert(cacheEntries.has('https://example.test/atlas/icons/atlas-192.png'), 'app shell did not cache the 192px install icon');
          assert(cacheEntries.has('https://example.test/atlas/icons/atlas-512.png'), 'app shell did not cache the 512px install icon');
          assert(cacheEntries.has('https://example.test/atlas/icons/atlas-maskable.svg'), 'app shell did not cache the maskable install icon');
          await dispatch('activate', {});
          assert(claimed, 'service worker did not claim clients');
          assert(deletedCaches.includes('sacred-geometry-atlas-old'), 'old cache was not retired');
          online = false;
          const offlineRoot = await dispatch('fetch', {
            request: { method: 'GET', mode: 'navigate', url: 'https://example.test/atlas/' }
          });
          assert(offlineRoot && offlineRoot.url === 'https://example.test/atlas/', 'offline Atlas root did not return the cached app shell');
          const offlineNavigation = await dispatch('fetch', {
            request: { method: 'GET', mode: 'navigate', url: 'https://example.test/atlas/a-missing-path' }
          });
          assert(offlineNavigation && offlineNavigation.url === 'https://example.test/atlas/404.html', 'offline missing path did not fall back to cached 404 recovery');
          online = true;
          const freshAsset = await dispatch('fetch', {
            request: { method: 'GET', mode: 'same-origin', url: 'https://example.test/atlas/styles.css' }
          });
          assert(freshAsset && freshAsset.body === 'network', 'network-first fetch did not prefer fresh asset content');
          console.log('Offline app-shell install, recovery, update, and cache cleanup smoke test passed.');
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
