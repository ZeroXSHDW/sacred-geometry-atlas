name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static site
        # Contract marker: node scripts/sync-geometry-json.js --check
        run: bash scripts/validate-pages-source.sh
      - name: Smoke-test theme preference bootstrap and cycle
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function bootstrapSource(path) {
            const html = fs.readFileSync(path, 'utf8');
            const scripts = [...html.matchAll(/<script>\s*([\s\S]*?)\s*<\/script>/g)];
            if (!scripts.length) throw new Error(`Missing inline bootstrap in ${path}`);
            return scripts[0][1];
          }

          function runBootstrap(path, storedMode, systemLight) {
            const root = { dataset: {}, style: {} };
            const themeMetas = [
              { content: '#111817', setAttribute(name, value) { this[name] = value; } },
              { content: '#f4f6f1', setAttribute(name, value) { this[name] = value; } }
            ];
            const context = {
              window: {
                localStorage: {
                  getItem() {
                    return storedMode;
                  }
                },
                matchMedia() {
                  return { matches: systemLight };
                }
              },
              document: {
                documentElement: root,
                querySelector(selector) {
                  return selector === 'meta[name="theme-color"]' ? themeMetas[0] : null;
                },
                querySelectorAll(selector) {
                  return selector === 'meta[name="theme-color"]' ? themeMetas : [];
                }
              }
            };
            vm.runInNewContext(bootstrapSource(path), context);
            return {
              mode: root.dataset.themeMode,
              theme: root.dataset.theme,
              source: root.dataset.themeSource,
              colorScheme: root.style.colorScheme,
              metaColor: themeMetas.map((meta) => meta.content).join('|')
            };
          }

          function assertState(actual, expected, label) {
            for (const [key, value] of Object.entries(expected)) {
              if (actual[key] !== value) throw new Error(`${label}: expected ${key}=${value}, received ${actual[key]}`);
            }
          }

          assertState(runBootstrap('index.html', null, true), { mode: 'system', theme: 'light', source: 'system', colorScheme: 'light', metaColor: '#f4f6f1|#f4f6f1' }, 'default Atlas preference');
          assertState(runBootstrap('index.html', 'light', false), { mode: 'light', theme: 'light', source: 'user', colorScheme: 'light', metaColor: '#f4f6f1|#f4f6f1' }, 'stored light preference');
          assertState(runBootstrap('index.html', 'dark', true), { mode: 'dark', theme: 'dark', source: 'user', colorScheme: 'dark', metaColor: '#111817|#111817' }, 'stored dark preference');
          assertState(runBootstrap('index.html', 'invalid', false), { mode: 'system', theme: 'dark', source: 'system', colorScheme: 'dark', metaColor: '#111817|#111817' }, 'invalid preference fallback');
          assertState(runBootstrap('404.html', 'system', true), { mode: 'system', theme: 'light', colorScheme: 'light', metaColor: '#f4f6f1|#f4f6f1' }, '404 system preference');
          assertState(runBootstrap('404.html', 'dark', true), { mode: 'dark', theme: 'dark', colorScheme: 'dark', metaColor: '#111817|#111817' }, '404 dark preference');

          const root = { dataset: { theme: 'light', themeMode: 'system', themeSource: 'system' }, style: {} };
          const label = { textContent: '' };
          const icon = { textContent: '' };
          const status = { textContent: '' };
          const themeMetas = [
            { content: '#f4f6f1', setAttribute(name, value) { this[name] = value; } },
            { content: '#f4f6f1', setAttribute(name, value) { this[name] = value; } }
          ];
          const themeColors = () => themeMetas.map((meta) => meta.content).join('|');
          const mediaQuery = { matches: true, addEventListener(name, handler) { this.listener = handler; } };
          const storage = { values: new Map(), setItem(key, value) { this.values.set(key, value); } };
          const button = {
            dataset: {},
            hidden: true,
            attributes: {},
            listeners: {},
            querySelector(selector) {
              return selector === '.theme-toggle-label' ? label : selector === '.theme-toggle-icon' ? icon : null;
            },
            setAttribute(name, value) {
              this.attributes[name] = value;
            },
            addEventListener(name, handler) {
              this.listeners[name] = handler;
            }
          };
          const context = {
            console,
            window: {
              CHURCH_GEOMETRY: [],
              CHURCH_GEOMETRY_SCHEMA: { statusValues: [] },
              localStorage: storage,
              matchMedia() { return mediaQuery; },
              listeners: {},
              addEventListener(name, handler) { this.listeners[name] = handler; }
            },
            document: {
              documentElement: root,
              baseURI: 'https://example.test/',
              querySelector(selector) {
                if (selector === '#themeToggle') return button;
                if (selector === '#themeStatus') return status;
                if (selector === 'meta[name="theme-color"]') return themeMetas[0];
                return null;
              },
              querySelectorAll(selector) { return selector === 'meta[name="theme-color"]' ? themeMetas : []; }
            }
          };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { setupThemePreference };\n})();');
          vm.runInNewContext(app, context);
          context.window.__atlasTest.setupThemePreference();
          if (button.hidden || label.textContent !== 'System' || button.dataset.themeMode !== 'system' || button.attributes['aria-label'] !== 'Color theme: System. Switch to light theme') throw new Error('Theme control did not initialize in System mode');
          button.listeners.click();
          if (root.dataset.themeMode !== 'light' || root.dataset.theme !== 'light' || themeColors() !== '#f4f6f1|#f4f6f1' || storage.values.get('sacred-geometry-atlas-theme') !== 'light' || status.textContent !== 'Light color theme enabled.') throw new Error('Theme control did not advance to Light mode');
          button.listeners.click();
          if (root.dataset.themeMode !== 'dark' || root.dataset.theme !== 'dark' || themeColors() !== '#111817|#111817' || storage.values.get('sacred-geometry-atlas-theme') !== 'dark') throw new Error('Theme control did not advance to Dark mode');
          button.listeners.click();
          if (root.dataset.themeMode !== 'system' || root.dataset.theme !== 'light' || themeColors() !== '#f4f6f1|#f4f6f1' || root.dataset.themeSource !== 'system' || storage.values.get('sacred-geometry-atlas-theme') !== 'system' || label.textContent !== 'System') throw new Error('Theme control did not return to System mode');
          if (typeof context.window.listeners.storage !== 'function') throw new Error('Theme preference did not register a storage listener');
          context.window.listeners.storage({ key: 'unrelated-setting', newValue: 'dark' });
          if (root.dataset.themeMode !== 'system' || root.dataset.theme !== 'light') throw new Error('Unrelated storage changes should not alter the Atlas theme');
          context.window.listeners.storage({ key: 'sacred-geometry-atlas-theme', newValue: 'dark' });
          if (root.dataset.themeMode !== 'dark' || root.dataset.theme !== 'dark' || themeColors() !== '#111817|#111817' || status.textContent !== 'Dark color theme synced from another Atlas tab.') throw new Error('Theme control did not sync a Dark preference from another Atlas tab');
          context.window.listeners.storage({ key: 'sacred-geometry-atlas-theme', newValue: null });
          if (root.dataset.themeMode !== 'system' || root.dataset.theme !== 'light' || themeColors() !== '#f4f6f1|#f4f6f1' || status.textContent !== 'System color theme synced from another Atlas tab.') throw new Error('Cleared theme preference did not sync back to System mode');
          console.log('Theme preference bootstrap and cycle smoke test passed.');
          NODE
      - name: Smoke-test hero provenance summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const elements = new Map([
            ['#heroDataNote', { attributes: {}, setAttribute(name, value) { this.attributes[name] = value; } }],
            ['#heroDataNoteText', { textContent: '' }],
            ['#heroDataNoteDefinition', { textContent: '' }]
          ]);
          const context = {
            console,
            window: {},
            document: {
              querySelector(selector) { return elements.get(selector) || null; },
              querySelectorAll() { return []; }
            }
          };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const statusLabel = (status) => String(status).trim().split(/[\s_-]+/).filter(Boolean).map((word) => word[0].toUpperCase() + word.slice(1)).join(" ");
          const expectedHero = () => {
            const counts = Object.fromEntries(context.window.CHURCH_GEOMETRY_SCHEMA.statusValues.map((status) => [status, context.window.CHURCH_GEOMETRY.filter((study) => study.status === status).length]));
            const summary = context.window.CHURCH_GEOMETRY_SCHEMA.statusValues.map((status) => `${String(counts[status] || 0).padStart(2, "0")} ${status.toLowerCase()}`).join(" · ");
            const definition = context.window.CHURCH_GEOMETRY_SCHEMA.statusValues.filter((status) => counts[status] > 0).map((status) => `${statusLabel(status)} = ${context.window.CHURCH_GEOMETRY_SCHEMA.statusDefinitions[status] || "Data status is not documented."}`).join(" ");
            return { counts, summary, definition };
          };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { renderHeroProvenance };\n})();');
          vm.runInNewContext(app, context);
          const { renderHeroProvenance } = context.window.__atlasTest;
          renderHeroProvenance();
          const initialHero = expectedHero();
          if (elements.get('#heroDataNoteText').textContent !== initialHero.summary || elements.get('#heroDataNoteDefinition').textContent !== initialHero.definition || elements.get('#heroDataNote').attributes['data-status'] !== 'schematic') throw new Error('Hero provenance summary did not expose the current schema-backed status counts, definition, and state cue');
          context.window.CHURCH_GEOMETRY[0].status = 'measured';
          context.window.CHURCH_GEOMETRY_SCHEMA.statusDefinitions.measured = 'Custom measured definition.';
          renderHeroProvenance();
          const mixedHero = expectedHero();
          if (elements.get('#heroDataNoteText').textContent !== mixedHero.summary || elements.get('#heroDataNoteDefinition').textContent !== mixedHero.definition || elements.get('#heroDataNote').attributes['data-status'] !== 'mixed' || !elements.get('#heroDataNote').attributes['aria-label'].includes('Measured = Custom measured definition.')) throw new Error('Hero provenance summary did not follow a changed record status, schema definition, or mixed-state cue');
          console.log('Hero provenance summary smoke test passed.');
          NODE
      - name: Smoke-test connection recovery status
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const listeners = {};
          const timers = [];
          const cleared = [];
          const status = {
            hidden: true,
            attributes: {},
            setAttribute(name, value) { this.attributes[name] = value; }
          };
          const message = { textContent: '' };
          const context = {
            console,
            navigator: { onLine: false },
            window: {
              CHURCH_GEOMETRY: [],
              CHURCH_GEOMETRY_SCHEMA: { statusValues: [] },
              addEventListener(name, handler) { listeners[name] = handler; },
              clearTimeout(id) { cleared.push(id); },
              setTimeout(handler) {
                const timer = { id: timers.length + 1, handler };
                timers.push(timer);
                return timer.id;
              }
            },
            document: {
              querySelector(selector) {
                if (selector === '#connectionStatus') return status;
                if (selector === '#connectionStatusText') return message;
                return null;
              },
              querySelectorAll() { return []; }
            }
          };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { setupConnectionStatus };\n})();');
          vm.runInNewContext(app, context);
          context.window.__atlasTest.setupConnectionStatus();
          if (!listeners.offline || !listeners.online || status.hidden || status.attributes['data-connection-state'] !== 'offline' || message.textContent !== 'Offline mode · cached Atlas shell and data are available.') throw new Error('Initial offline state did not expose the cached-shell recovery notice');
          listeners.online();
          if (status.hidden || status.attributes['data-connection-state'] !== 'online' || message.textContent !== 'Back online · fresh content will be used for the next request.' || timers.length !== 1) throw new Error('Online recovery did not expose the positive state or schedule its dismissal');
          listeners.offline();
          if (status.hidden || status.attributes['data-connection-state'] !== 'offline' || cleared[0] !== 1 || message.textContent !== 'Offline mode · cached Atlas shell and data are available.') throw new Error('A return to offline mode did not replace the pending online dismissal');
          listeners.online();
          timers[timers.length - 1].handler();
          if (!status.hidden || cleared[cleared.length - 1] !== 2) throw new Error('Online recovery did not hide itself after its timeout');
          console.log('Connection recovery status smoke test passed.');
          NODE
      - name: Validate high-contrast drawing affordances
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js', 'utf8');
          const styles = fs.readFileSync('styles.css', 'utf8');
          for (const token of [
            'class="dimension-arrow"',
            '@media (prefers-contrast: more)',
            '.geometry-svg .grid-line { stroke: var(--line-strong); opacity: 0.55; }',
            '.geometry-svg .dimension-arrow { stroke-width: 1.4; }',
            '@media (forced-colors: active)',
            '.svg-wrap { background: Canvas; }',
            '.geometry-svg { color: CanvasText; forced-color-adjust: none; }',
            '.geometry-svg .grid-line { stroke: ButtonText; opacity: 0.35; }',
            '.geometry-svg .dimension-arrow,',
            '.geometry-svg .primary-fill,',
            '.geometry-svg .interior-fill { fill: Canvas; }',
            '.geometry-svg .dim-text,',
            '.geometry-svg .label-text,',
            '.geometry-svg .small-label,',
            '.geometry-svg .watermark { fill: CanvasText; }'
          ]) {
            if (!app.includes(token) && !styles.includes(token)) throw new Error(`Missing high-contrast drawing affordance: ${token}`);
          }
          console.log('High-contrast drawing affordances validated.');
          NODE
      - name: Smoke-test schema-valid zero symmetry
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { dataIssue, isRenderableStudy };\n})();');
          vm.runInNewContext(app, context);
          const { dataIssue, isRenderableStudy } = context.window.__atlasTest;
          if (dataIssue) throw new Error(`Current dataset was rejected by runtime validation: ${dataIssue}`);
          const asymmetricStudy = { ...context.window.CHURCH_GEOMETRY[0], symmetry: 0 };
          if (!isRenderableStudy(asymmetricStudy)) throw new Error('A schema-valid symmetry index of 0 was rejected by runtime validation');
          if (isRenderableStudy({ ...asymmetricStudy, symmetry: -0.01 })) throw new Error('A negative symmetry index was accepted by runtime validation');
          console.log('Schema-valid zero symmetry smoke test passed.');
          NODE
      - name: Smoke-test generated no-script fallback
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');
          const vm = require('vm');
          const temporaryRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'sacred-geometry-sync-'));
          try {
            fs.mkdirSync(path.join(temporaryRoot, 'scripts'));
            fs.mkdirSync(path.join(temporaryRoot, 'data'));
            fs.copyFileSync('scripts/sync-geometry-json.js', path.join(temporaryRoot, 'scripts/sync-geometry-json.js'));
            fs.copyFileSync('data/geometry.js', path.join(temporaryRoot, 'data/geometry.js'));
            fs.copyFileSync('index.html', path.join(temporaryRoot, 'index.html'));
            const sourcePath = path.join(temporaryRoot, 'data/geometry.js');
            const originalSource = fs.readFileSync(sourcePath, 'utf8');
            const baseContext = { window: {} };
            vm.runInNewContext(originalSource, baseContext, { filename: sourcePath });
            const baseSchema = baseContext.window.CHURCH_GEOMETRY_SCHEMA;
            const baseStudies = baseContext.window.CHURCH_GEOMETRY;
            if (!baseSchema || !Array.isArray(baseStudies) || !baseStudies.length) throw new Error('Temporary no-script fixture needs a non-empty geometry collection');
            const firstStudy = baseStudies[0];
            const mutatedSourceUrl = 'https://example.com/atlas?part=<source>';
            const htmlEncode = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            }[character]));
            const csvCell = (value) => '"' + String(value ?? '').replace(/"/g, '""') + '"';
            const source = originalSource
              .replace('name: ' + JSON.stringify(firstStudy.name), 'name: "The longitudinal <basilica>"')
              .replace('shortName: ' + JSON.stringify(firstStudy.shortName), 'shortName: "Longitudinal basilica"')
              .replace('churchName: ' + JSON.stringify(firstStudy.churchName), 'churchName: "Representative longitudinal basilica"')
              .replace('place: ' + JSON.stringify(firstStudy.place), 'place: "Mediterranean"')
              .replace('era: ' + JSON.stringify(firstStudy.era), 'era: "4th–6th century"')
              .replace('source: ' + JSON.stringify(firstStudy.source), 'source: "Sacred Geometry Atlas proportional model"')
              .replace('sourceUrl: ' + JSON.stringify(firstStudy.sourceUrl), 'sourceUrl: ' + JSON.stringify(mutatedSourceUrl))
              .replace('sourceNote: ' + JSON.stringify(firstStudy.sourceNote), 'sourceNote: "Source <note>"')
              .replace('status: ' + JSON.stringify(firstStudy.status), 'status: "measured"')
              .replace('length: ' + firstStudy.length + ',', 'length: 58,')
              .replace('span: ' + firstStudy.span + ',', 'span: 22,')
              .replace('module: ' + firstStudy.module + ',', 'module: 7.2,')
              .replace('radius: ' + firstStudy.radius + ',', 'radius: 11,')
              .replace('height: ' + firstStudy.height + ',', 'height: 18,\n    floorAreaEstimate: 1276,\n    volumeEstimate: 14239,\n    volumeBasis: "Bounding area × height × 0.62",');
            fs.writeFileSync(sourcePath, source);
            const result = spawnSync(process.execPath, ['scripts/sync-geometry-json.js'], { cwd: temporaryRoot, encoding: 'utf8' });
            if (result.status !== 0) throw new Error(result.stderr || result.stdout || 'Temporary no-script generation failed');
            const generated = fs.readFileSync(path.join(temporaryRoot, 'index.html'), 'utf8');
            const generatedStatic = fs.readFileSync(path.join(temporaryRoot, 'static.html'), 'utf8');
            const generatedCsv = fs.readFileSync(path.join(temporaryRoot, 'data/geometry.csv'), 'utf8');
            const routeTarget = 'atlas/' + encodeURIComponent(firstStudy.id) + '/plan/exterior/all';
            const firstOriginalStatusCount = baseStudies.filter((study) => study.status === firstStudy.status).length - 1;
            if (!generated.includes('<li id="' + routeTarget + '" tabindex="-1">') || !generated.includes('The longitudinal &lt;basilica&gt;') || !generated.includes('class="noscript-study-link" href="#' + routeTarget + '"') || !generated.includes('aria-describedby="atlas-meta-') || !generated.includes('class="noscript-derived"') || !generated.includes('class="noscript-provenance"') || !generated.includes('class="noscript-reading"') || !generated.includes('Readings: 7 bays · module 7.2 m · radius 11 m') || !generated.includes('floor area 1,276 m² (supplied floor-area estimate)') || !generated.includes('volume 14,239 m³ (Bounding area × height × 0.62)') || !generated.includes('reading profile (interpretive 0–100):') || !generated.includes('class="noscript-source-link" href="' + htmlEncode(mutatedSourceUrl) + '" target="_blank" rel="noopener noreferrer"') || !generated.includes('Provenance: <a class="noscript-source-link"') || !generated.includes('Source &lt;note&gt;') || !generated.includes('named churches anchor') || !generated.includes('The collection mixes schematic and measured records') || !generated.includes('class="noscript-status-key-count">' + firstOriginalStatusCount + ' records</span>')) {
              throw new Error('Generated no-script fallback did not reflect escaped route links, content, and mixed provenance');
            }
            if (!generated.includes('<section class="noscript-method" aria-labelledby="noscript-method-heading">') || !generated.includes('id="noscript-method-grid"') || !generated.includes('class="noscript-artifact-actions" role="group" aria-label="Open static atlas artifacts"')) throw new Error('Generated no-script fallback did not preserve its accessible reading key');
            if (!generatedStatic.includes('<title>Static collection · Sacred Geometry Atlas</title>') || !generatedStatic.includes('<body class="static-fallback-page">') || !generatedStatic.includes('<li id="' + routeTarget + '" tabindex="-1">') || !generatedStatic.includes('<a class="noscript-interactive-link" href="./#' + routeTarget + '"') || !generatedStatic.includes('<section class="noscript-method" aria-labelledby="noscript-method-heading">') || !generatedStatic.includes('The longitudinal &lt;basilica&gt;') || generatedStatic.includes('<script')) throw new Error('Generated static collection did not preserve the escaped collection, interactive route handoff, and script-free contract');
            if (!generated.includes('reading profile (interpretive 0–100):') || !generated.includes('Interpretive proportional tendencies, not empirical measurements.') || !generated.includes('Basis: linearity = length ÷ span · verticality = height ÷ span · radiality = typology cue · repetition = bay count.')) throw new Error('Generated no-script fallback did not expose the self-describing interpretive reading-profile scores');
            if (!generated.includes('<div><dt>Reading profile</dt><dd>Four interpretive 0–100 scores: normalized length ÷ span, height ÷ span, a typology cue, and normalized bay count. They describe tendencies, not empirical measurements.</dd></div>')) throw new Error('Generated no-script fallback did not explain the interpretive reading-profile score basis');
            if (!generated.includes('<section class="noscript-status-key" aria-labelledby="noscript-status-key-heading">') || !generated.includes('data-status="' + firstStudy.status + '"') || !generated.includes('data-status="measured"') || !generated.includes('class="noscript-status-key-count">1 record</span>') || !generated.includes('class="noscript-status-key-count">' + firstOriginalStatusCount + ' records</span>')) throw new Error('Generated no-script fallback did not expose its mixed evidence status key');
            const expectedCsvPrefix = [firstStudy.id, 'Longitudinal basilica', firstStudy.typology, firstStudy.index, 'Mediterranean'].map(csvCell).join(',');
            if (!generatedCsv.includes('"Source <note>"') || !generatedCsv.includes('"measured","Source-supported dimensions."') || !generatedCsv.includes('"ID","Study","Typology","Index","Place"') || !generatedCsv.includes(expectedCsvPrefix) || !generatedCsv.includes(csvCell(mutatedSourceUrl)) || !generatedCsv.includes('"Floor area basis"') || !generatedCsv.includes('"supplied floor-area estimate"') || !generatedCsv.includes('"Schema URL"') || !generatedCsv.includes('"data/geometry.schema.json"')) throw new Error('Generated CSV did not preserve the curated index, provenance, status context, floor-area basis, and schema URL');
            if (!generatedCsv.includes('"Schema URL","Linearity profile (0–100)","Verticality profile (0–100)","Radiality profile (0–100)","Repetition profile (0–100)","Reading profile basis"') || !generatedCsv.includes('linearity = length ÷ span · verticality = height ÷ span · radiality = typology cue · repetition = bay count; Interpretive proportional tendencies, not empirical measurements.')) throw new Error('Generated CSV did not expose self-describing interpretive reading-profile scores');
            const customStatusSource = fs.readFileSync('data/geometry.js', 'utf8')
              .replace('statusValues: ["schematic", "measured"],', 'statusValues: ["schematic", "measured", "estimated_pending"],')
              .replace('    measured: "Source-supported dimensions."\n  },', '    measured: "Source-supported dimensions.",\n    estimated_pending: "Proportional estimate pending source review."\n  },')
              .replace('status: ' + JSON.stringify(firstStudy.status), 'status: "estimated_pending"');
            fs.writeFileSync(sourcePath, customStatusSource);
            const customStatusResult = spawnSync(process.execPath, ['scripts/sync-geometry-json.js'], { cwd: temporaryRoot, encoding: 'utf8' });
            if (customStatusResult.status !== 0) throw new Error(customStatusResult.stderr || customStatusResult.stdout || 'Custom-status no-script generation failed');
            const customStatusGenerated = fs.readFileSync(path.join(temporaryRoot, 'index.html'), 'utf8');
            const customStatusCsv = fs.readFileSync(path.join(temporaryRoot, 'data/geometry.csv'), 'utf8');
            if (!customStatusGenerated.includes('The collection uses ' + (baseStudies.length - 1) + ' schematic · 1 estimated pending records.') || !customStatusGenerated.includes('Estimated Pending = Proportional estimate pending source review.') || !customStatusGenerated.includes((baseStudies.length - 1) + ' schematic · 1 estimated pending')) {
              throw new Error('Generated no-script fallback did not preserve a schema-defined custom status');
            }
            if (!customStatusGenerated.includes('class="noscript-status-key-label" data-status="estimated_pending">Estimated Pending</span> <code>estimated_pending</code>') || !customStatusGenerated.includes('Proportional estimate pending source review.') || !customStatusGenerated.includes('class="noscript-status-key-count">1 record</span>')) throw new Error('Generated no-script fallback did not expose a custom evidence status key');
            if (!customStatusCsv.includes('"estimated_pending","Proportional estimate pending source review."')) throw new Error('Generated CSV did not preserve a schema-defined custom status');
            const noteSource = fs.readFileSync('data/geometry.js', 'utf8')
              .replace('note: ' + JSON.stringify(baseSchema.note), 'note: "Custom <note> disclaimer."');
            fs.writeFileSync(sourcePath, noteSource);
            const noteResult = spawnSync(process.execPath, ['scripts/sync-geometry-json.js'], { cwd: temporaryRoot, encoding: 'utf8' });
