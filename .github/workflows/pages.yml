            const missingEstimateCsv = fs.readFileSync(path.join(temporaryRoot, 'data/geometry.csv'), 'utf8');
            if (!missingEstimateCsv.includes('"No estimate supplied"') || missingEstimateCsv.includes('"stale basis without estimate"')) throw new Error('Generated CSV exposed a volume basis without its estimate');
            const emptySource = fs.readFileSync('data/geometry.js', 'utf8').replace(/window\.CHURCH_GEOMETRY = \[[\s\S]*?\n\];/, 'window.CHURCH_GEOMETRY = [];');
            fs.writeFileSync(sourcePath, emptySource);
            const emptyResult = spawnSync(process.execPath, ['scripts/sync-geometry-json.js'], { cwd: temporaryRoot, encoding: 'utf8' });
            if (emptyResult.status !== 0) throw new Error(emptyResult.stderr || emptyResult.stdout || 'Empty no-script generation failed');
            const emptyGenerated = fs.readFileSync(path.join(temporaryRoot, 'index.html'), 'utf8');
            const emptyCsv = fs.readFileSync(path.join(temporaryRoot, 'data/geometry.csv'), 'utf8');
            if (!emptyGenerated.includes('No studies are currently available in the church geometry collection. Schema 1.1 · units: meters.') || !emptyGenerated.includes('No study records are currently available.') || !emptyGenerated.includes('The collection is currently empty. Schema 1.1 · units: meters.') || emptyGenerated.includes('<ol class="noscript-list">') || emptyGenerated.includes('Zero schematic studies') || emptyCsv.replace(/^\uFEFF/, '').trim().split(/\r?\n/).length !== 1) {
              throw new Error('Empty no-script fallback did not render an honest collection state');
            }
            console.log('Generated no-script fallback smoke test passed.');
          } finally {
            fs.rmSync(temporaryRoot, { recursive: true, force: true });
          }
