            if (!status.textContent.includes('shown below for manual copying')) throw new Error('Citation fallback did not announce its manual-copy state');
            console.log('Citation manual-copy fallback smoke test passed.');
          }).catch((error) => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Smoke-test share-link manual-copy fallbacks
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const elements = new Map();
          const makeButton = (label) => {
            const visibleLabel = { textContent: label };
            const classes = new Set();
            return {
              disabled: false,
              classList: {
                add(name) { classes.add(name); },
                remove(name) { classes.delete(name); }
              },
              querySelector(selector) { return selector === 'span:last-child' ? visibleLabel : null; },
              setAttribute(name, value) { this[name] = value; }
            };
          };
          const makeFallback = () => ({
            hidden: true,
            text: {
              value: '',
              focusCalls: 0,
              selectCalls: 0,
              focus() { this.focusCalls += 1; },
              select() { this.selectCalls += 1; }
            }
          });
          const shareStudyButton = makeButton('Share study');
          const shareCatalogButton = makeButton('Share view');
          const shareCompareButton = makeButton('Share comparison');
          const shareStudyFallback = makeFallback();
          const shareCatalogFallback = makeFallback();
          const shareCompareFallback = makeFallback();
          elements.set('#shareStudy', shareStudyButton);
          elements.set('#shareStatus', { textContent: '' });
          elements.set('#shareFallback', shareStudyFallback);
          elements.set('#shareFallbackText', shareStudyFallback.text);
          elements.set('#shareCatalog', shareCatalogButton);
          elements.set('#catalogShareStatus', { textContent: '' });
          elements.set('#catalogShareFallback', shareCatalogFallback);
          elements.set('#catalogShareFallbackText', shareCatalogFallback.text);
          elements.set('#shareCompare', shareCompareButton);
          elements.set('#compareShareStatus', { textContent: '' });
          elements.set('#compareShareFallback', shareCompareFallback);
          elements.set('#compareShareFallbackText', shareCompareFallback.text);
          const context = {
            URL,
            navigator: {},
            window: {
              isSecureContext: false,
              location: { href: 'https://example.test/atlas/#atlas/basilica/plan/exterior/all' },
              clearTimeout() {},
              setTimeout() { return 1; },
              addEventListener() {}
            },
            document: {
              activeElement: shareStudyButton,
              body: {},
              querySelector(selector) { return elements.get(selector) || null; },
              querySelectorAll() { return []; },
              createElement() { throw new Error('Copy APIs unavailable'); }
            }
          };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { shareStudy, shareCatalog, shareComparison };\n})();');
          vm.runInNewContext(app, context);
          const cases = [
            ['shareStudy', shareStudyFallback, 'The share link is shown below for manual copying', 'https://example.test/atlas/#atlas/basilica/plan/exterior'],
            ['shareCatalog', shareCatalogFallback, 'The catalog link is shown below for manual copying', 'https://example.test/atlas/#atlas'],
            ['shareComparison', shareCompareFallback, 'The comparison link is shown below for manual copying', 'https://example.test/atlas/#compare']
          ];
          (async () => {
            for (const [name, fallback, message, marker] of cases) {
              await context.window.__atlasTest[name]();
              const statusSelector = name === 'shareStudy' ? '#shareStatus' : name === 'shareCatalog' ? '#catalogShareStatus' : '#compareShareStatus';
              const status = elements.get(statusSelector);
              if (fallback.hidden || !fallback.text.value.startsWith(marker) || fallback.text.focusCalls !== 1 || fallback.text.selectCalls !== 1 || !status.textContent.includes(message)) {
                throw new Error(`${name} did not reveal and select its manual-copy link fallback`);
              }
            }
            if (shareStudyButton.disabled || shareCatalogButton.disabled || shareCompareButton.disabled) throw new Error('Share-link fallback did not restore the share button states');
            console.log('Share-link manual-copy fallback smoke test passed.');
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Smoke-test export busy cooldown
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const timers = [];
          const context = {
            window: {
              CHURCH_GEOMETRY: [],
              setTimeout(callback, delay) {
                timers.push({ callback, delay });
                return timers.length;
              }
            },
            document: {
              querySelector() { return null; },
              querySelectorAll() { return []; }
            }
          };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { beginAsyncAction, endAsyncAction };\n})();');
          vm.runInNewContext(app, context);
          const { beginAsyncAction, endAsyncAction } = context.window.__atlasTest;
          const button = {
            disabled: false,
            setAttribute(name, value) { this[name] = value; }
          };
          if (!beginAsyncAction(button) || !button.disabled || button['aria-busy'] !== 'true') throw new Error('Export action did not enter its busy state');
          if (beginAsyncAction(button)) throw new Error('Busy export action accepted a duplicate activation');
          endAsyncAction(button, 400);
          if (!button.disabled || button['aria-busy'] !== 'true' || timers.length !== 1 || timers[0].delay !== 400) throw new Error('Export action released its busy state too early');
          timers[0].callback();
          if (button.disabled || button['aria-busy'] !== 'false') throw new Error('Export action did not release after its cooldown');
          console.log('Export busy cooldown smoke test passed.');
          NODE

      - name: Smoke-test schema-backed status guidance
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const elements = new Map();
          const status = { title: '', attributes: {}, setAttribute(name, value) { this.attributes[name] = value; } };
          elements.set('#activeProvenanceSummary', { textContent: '' });
          elements.set('#activeProvenanceDefinition', { textContent: '' });
          elements.set('#activeSchemaNote', { textContent: '' });
          elements.set('#activeStatus', status);
          elements.set('#atlasSchemaNote', { textContent: '' });
          elements.set('#methodProvenanceNote', { textContent: '' });
          const context = { window: {}, document: { querySelector(selector) { return elements.get(selector) || null; } }, navigator: {} };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), context);
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { dataStatusDefinitions, studyStatusDescription, statusGuidanceText, renderActiveProvenance, atlasSchemaNoteText, methodProvenanceText };\n})();');
          vm.runInNewContext(app, context);
          const { dataStatusDefinitions, studyStatusDescription, statusGuidanceText, renderActiveProvenance, atlasSchemaNoteText, methodProvenanceText } = context.window.__atlasTest;
          const definitions = dataStatusDefinitions();
          if (definitions.schematic !== context.window.CHURCH_GEOMETRY_SCHEMA.statusDefinitions.schematic || definitions.measured !== context.window.CHURCH_GEOMETRY_SCHEMA.statusDefinitions.measured) throw new Error('Status definitions did not come from the dataset schema');
          if (studyStatusDescription({ status: 'schematic' }) !== definitions.schematic || studyStatusDescription({ status: 'measured' }) !== definitions.measured) throw new Error('Study status descriptions are not schema-backed');
          if (atlasSchemaNoteText() !== 'Illustrative proportions · metric units · v1.1' || atlasSchemaNoteText([{ status: 'schematic' }, { status: 'measured' }]) !== 'Mixed provenance · metric units · v1.1') throw new Error('Atlas collection note did not follow schema units, version, and status mix');
          if (!methodProvenanceText().startsWith('The current collection is a schematic') || !methodProvenanceText([{ status: 'measured' }]).startsWith('The current collection uses source-supported dimensions') || !methodProvenanceText([{ status: 'schematic' }, { status: 'measured' }]).startsWith('The collection mixes schematic proportional studies')) throw new Error('Method provenance warning did not follow the collection status mix');
          renderActiveProvenance({ status: 'schematic' });
          if (elements.get('#activeProvenanceSummary').textContent !== 'Data status · schematic' || elements.get('#activeProvenanceDefinition').textContent !== definitions.schematic || elements.get('#activeSchemaNote').textContent !== 'Schema 1.1 · units: meters' || status.title !== definitions.schematic || status.attributes['aria-label'] !== `schematic: ${definitions.schematic}`) throw new Error('Active study provenance disclosure did not follow the schema');
          const guidance = statusGuidanceText();
          if (!guidance.includes(`Schematic = ${definitions.schematic}`) || !guidance.includes(`Measured = ${definitions.measured}`) || !guidance.includes('6 schematic · 0 measured')) throw new Error('Visible status guidance did not preserve definitions and counts');
          const selectedGuidance = statusGuidanceText(context.window.CHURCH_GEOMETRY.slice(0, 2), '2 selected studies');
          if (!selectedGuidance.includes('Counts for 2 selected studies: 2 schematic · 0 measured')) throw new Error('Focused status guidance did not follow the comparison scope');
          console.log('Schema-backed status guidance smoke test passed.');
          NODE

      - name: Smoke-test guarded download fallback
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          let appended = 0;
          let removed = 0;
          let revoked = 0;
          class TestBlob {
            constructor(parts, options) {
              this.parts = parts;
              this.type = options.type;
            }
          }
          class TestUrl {
            static createObjectURL(blob) {
              if (!(blob instanceof TestBlob)) throw new Error('Expected a Blob payload');
              return 'blob:test';
            }
            static revokeObjectURL(url) {
              if (url === 'blob:test') revoked += 1;
            }
          }
          const context = {
            Blob: TestBlob,
            URL: TestUrl,
            window: {
              CHURCH_GEOMETRY: [],
              setTimeout() { throw new Error('Failed downloads must not schedule cleanup'); }
            },
            document: {
              body: { classList: { remove() {} }, appendChild() { appended += 1; } },
              createElement() {
                return { remove() { removed += 1; } };
              },
              querySelector() { return null; },
              querySelectorAll() { return []; }
            }
          };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { triggerDownload };\n})();');
          vm.runInNewContext(app, context);
          const downloaded = context.window.__atlasTest.triggerDownload('test.json', '{}', 'application/json');
          if (downloaded || appended !== 1 || removed !== 1 || revoked !== 1) throw new Error('Guarded download did not recover from missing anchor activation');
          console.log('Guarded download fallback smoke test passed.');
          NODE

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Stamp deployed site metadata
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/") + "/"
          page = Path("index.html")
          source = page.read_text()
          replacements = {
              '<link rel="canonical" href="./" />': f'<link rel="canonical" href="{html.escape(base_url, quote=True)}" />',
              '<meta property="og:url" content="./" />': f'<meta property="og:url" content="{html.escape(base_url, quote=True)}" />',
              '<meta property="og:image" content="og.png" />': f'<meta property="og:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
              '<meta name="twitter:image" content="og.png" />': f'<meta name="twitter:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Missing repository-relative metadata: {old}")
              source = source.replace(old, new)
          page.write_text(source)

          not_found = Path("404.html")
          not_found_source = not_found.read_text()
          not_found_replacements = {
              '<a class="home-link" data-site-root href="../">': f'<a class="home-link" data-site-root href="{html.escape(base_url, quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-dataset href="data/geometry.json">': f'<a class="home-link home-link-secondary" data-site-dataset href="{html.escape(base_url + "data/geometry.json", quote=True)}">',
          }
          for old, new in not_found_replacements.items():
              if old not in not_found_source:
                  raise SystemExit(f"Missing repository-relative 404 recovery link: {old}")
              not_found_source = not_found_source.replace(old, new)
          not_found.write_text(not_found_source)

          robots = Path("robots.txt")
          robots_source = robots.read_text()
          robots_marker = "Sitemap: ./sitemap.xml"
          robots_value = f"Sitemap: {html.escape(base_url + 'sitemap.xml', quote=True)}"
          if robots_marker not in robots_source:
              raise SystemExit(f"Missing repository-relative crawl marker: {robots_marker}")
          robots.write_text(robots_source.replace(robots_marker, robots_value))

          sitemap = Path("sitemap.xml")
          sitemap_source = sitemap.read_text()
          sitemap_marker = "<loc>./</loc>"
          sitemap_value = f"<loc>{html.escape(base_url, quote=True)}</loc>"
          if sitemap_marker not in sitemap_source:
              raise SystemExit(f"Missing repository-relative sitemap marker: {sitemap_marker}")
          sitemap.write_text(sitemap_source.replace(sitemap_marker, sitemap_value))
          print(f"Stamped absolute Pages metadata and crawl URLs for {base_url}")
          PY
      - name: Verify deployed site metadata
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/") + "/"
          page = Path("index.html").read_text()
          not_found = Path("404.html").read_text()
          robots = Path("robots.txt").read_text()
          sitemap = Path("sitemap.xml").read_text()
          expected = [
              f'<link rel="canonical" href="{base_url}" />',
              f'<meta property="og:url" content="{base_url}" />',
              f'<meta property="og:image" content="{base_url}og.png" />',
              f'<meta name="twitter:image" content="{base_url}og.png" />',
              f'Sitemap: {base_url}sitemap.xml',
              f'<loc>{base_url}</loc>',
          ]
          missing = [token for token in expected[:4] if token not in page]
          missing.extend(token for token in expected[4:] if token not in (robots + sitemap))
          expected_404 = [
              f'<a class="home-link" data-site-root href="{base_url}">',
              f'<a class="home-link home-link-secondary" data-site-dataset href="{base_url}data/geometry.json">',
          ]
          missing.extend(token for token in expected_404 if token not in not_found)
          if missing:
              raise SystemExit("Deployed metadata is incomplete: " + ", ".join(missing))
          print("Absolute Pages metadata verified.")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
