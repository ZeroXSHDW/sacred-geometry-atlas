                button: comparisonButton,
                status: elements.get('#comparisonRouteStatus'),
                fallback: comparisonRouteFallback,
                scope: 'comparison',
                url: expected[2]
              },
              {
                copy: copyMethodRoute,
                button: methodButton,
                status: elements.get('#methodRouteStatus'),
                fallback: methodRouteFallback,
                scope: 'method',
                url: expected[3]
              }
            ];
            for (const test of fallbackCases) {
              const result = await test.copy();
              const message = 'Copying the ' + test.scope + ' route was unavailable. The full route is shown below for manual copying.';
              if (result !== false || test.fallback.panel.hidden || test.fallback.text.value !== test.url || !test.fallback.text.selected || !test.fallback.text.focused || test.status.textContent !== message || test.button.label.textContent !== 'Unavailable' || !test.button.classes.has('is-unavailable') || test.button.attributes['aria-expanded'] !== 'true') throw new Error('Route copy actions did not expose a focused manual-copy field when clipboard access failed');
