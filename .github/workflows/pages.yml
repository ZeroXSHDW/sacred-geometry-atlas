      - name: Smoke-test route-aware share metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const dataContext = { window: {} };
          vm.runInNewContext(fs.readFileSync('data/geometry.js', 'utf8'), dataContext);
          const selectors = [
            'meta[name="description"]',
            'meta[property="og:title"]',
            'meta[property="og:description"]',
            'meta[property="og:url"]',
            'meta[name="twitter:title"]',
            'meta[name="twitter:description"]'
          ];
          const metas = new Map(selectors.map((selector) => [selector, {
            content: '',
            setAttribute(name, value) { this[name] = value; }
          }]));
          const location = { href: 'https://example.github.io/sacred-geometry-atlas/#atlas/gothic/section/interior/axis', hash: '#atlas/gothic/section/interior/axis' };
          const context = {
            window: {
              CHURCH_GEOMETRY: dataContext.window.CHURCH_GEOMETRY,
              CHURCH_GEOMETRY_SCHEMA: dataContext.window.CHURCH_GEOMETRY_SCHEMA,
              location
            },
            document: {
              title: '',
              querySelector(selector) { return metas.get(selector) || null; },
              querySelectorAll() { return []; }
            },
            URL,
            console
          };
          const app = fs.readFileSync('app.js', 'utf8').replace('  init();\n})();', '  window.__atlasTest = { state, updateDocumentTitle };\n})();');
          const searchStart = app.indexOf('$("#searchInput").addEventListener("input"');
          const searchEnd = app.indexOf('\n    $("#searchInput").addEventListener("keydown"', searchStart);
          const searchSource = searchStart >= 0 && searchEnd >= 0 ? app.slice(searchStart, searchEnd) : '';
          if (searchStart < 0 || searchEnd < 0 || searchSource.indexOf('replaceCatalogRoute();') < 0 || searchSource.indexOf('refreshCatalog();') < 0 || searchSource.indexOf('replaceCatalogRoute();') > searchSource.indexOf('refreshCatalog();')) throw new Error('Live catalog search must update the URL before route-aware share metadata refreshes');
          vm.runInNewContext(app, context);
          const { state, updateDocumentTitle } = context.window.__atlasTest;
          const firstStudy = context.window.CHURCH_GEOMETRY[0];
          const secondStudy = context.window.CHURCH_GEOMETRY[1];
          const firstLabel = firstStudy.shortName || firstStudy.name;
          const secondLabel = secondStudy.shortName || secondStudy.name;
          const content = (selector) => metas.get(selector).content;
          const setRoute = (hash) => {
            location.hash = hash;
            location.href = `https://example.github.io/sacred-geometry-atlas/${hash}`;
          };
          state.page = 'atlas';
          state.activeId = 'basilica';
          state.mode = 'plan';
          state.surface = 'exterior';
          state.layer = 'all';
          state.query = '';
          state.filter = 'all';
          state.filterPlace = 'all';
          state.filterEra = 'all';
          state.filterAxis = 'all';
          state.filterStatus = 'all';
          state.sort = 'index';
          state.sortDirection = 'desc';
          state.compareIds = [];
          setRoute('#atlas');
          updateDocumentTitle('atlas');
          if (context.document.title !== 'Sacred Geometry Atlas' || content('meta[property="og:title"]') !== 'Sacred Geometry Atlas' || !content('meta[name="description"]').includes('Explore church architecture')) throw new Error('The default collection route must keep collection-level browser and share metadata');
          state.page = 'atlas';
          state.activeId = 'gothic';
          state.mode = 'section';
          state.surface = 'interior';
          state.layer = 'axis';
          setRoute(`#atlas/${secondStudy.id}/section/interior/axis`);
          updateDocumentTitle('atlas');
          if (!content('meta[property="og:title"]').includes(secondLabel) || !content('meta[name="description"]').includes(secondStudy.place) || content('meta[property="og:url"]') !== location.href) throw new Error('Study metadata did not follow the active deep link');
          state.page = 'compare';
          state.compareIds = [firstStudy.id, secondStudy.id];
          setRoute(`#compare/${firstStudy.id},${secondStudy.id}`);
          updateDocumentTitle('compare');
          if (!content('meta[property="og:title"]').includes(firstLabel) || !content('meta[property="og:title"]').includes(secondLabel) || !content('meta[name="twitter:description"]').includes('provenance')) throw new Error('Comparison metadata did not identify its selected studies');
          state.page = 'method';
          setRoute(`#method/${secondStudy.id}`);
          updateDocumentTitle('method');
          if (!content('meta[name="twitter:title"]').includes('Method') || !content('meta[property="og:description"]').includes(secondLabel)) throw new Error('Method metadata did not preserve study context');
          console.log('Route-aware metadata smoke test passed.');
          NODE

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check patch hygiene
        run: git diff --check
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare Pages artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          site = Path("_site")
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()
          (site / "data").mkdir()
          (site / "icons").mkdir()
          (site / "research" / "images").mkdir(parents=True)

          public_files = [
              Path(".nojekyll"),
              Path("404.html"),
              Path("static.html"),
              Path("_headers"),
              Path("_redirects"),
              Path("app.js"),
              Path("favicon.svg"),
              Path("icons/atlas-180.png"),
              Path("icons/atlas-192.png"),
              Path("icons/atlas-512.png"),
              Path("icons/atlas-maskable.svg"),
              Path("index.html"),
              Path("ireland.html"),
              Path("ireland.css"),
              Path("ireland.js"),
              Path("og.png"),
              Path("print-studio.html"),
              Path("robots.txt"),
              Path("site.webmanifest"),
              Path("sitemap.xml"),
              Path("styles.css"),
              Path("sw.js"),
          ]
          research_files = [
              Path("research/README.md"),
              Path("research/acquired-assets.json"),
              Path("research/analysis-method.md"),
              Path("research/annotated-atlas.html"),
              Path("research/asset-measurements.json"),
              Path("research/constructor-evidence.json"),
              Path("research/data-probes.json"),
              Path("research/geometry-analysis.json"),
              Path("research/image-manifest.json"),
              Path("research/measurement-register.json"),
              Path("research/model-metadata.json"),
              Path("research/next-acquisition-prompt.md"),
              Path("research/scan-manifest.json"),
              Path("research/st-pauls-colmap.json"),
          ]
          research_files.extend(sorted(Path("research/images").glob("*.jpg")))
          public_files.extend(research_files)
          custom_domain = Path("CNAME")
          if custom_domain.exists() and not custom_domain.is_file():
              raise SystemExit("CNAME must be a file when present")
          if custom_domain.is_file():
              public_files.append(custom_domain)
          data_files = [
              Path("data/geometry.csv"),
              Path("data/geometry.js"),
              Path("data/geometry.json"),
              Path("data/geometry.schema.json"),
          ]
          for source in public_files:
              shutil.copy2(source, site / source)
          for source in data_files:
              shutil.copy2(source, site / source)

          expected = {
              ".nojekyll",
              "404.html",
              "static.html",
              "_headers",
              "_redirects",
              "app.js",
              "favicon.svg",
              "icons/atlas-180.png",
              "icons/atlas-192.png",
              "icons/atlas-512.png",
              "icons/atlas-maskable.svg",
              "index.html",
              "ireland.html",
              "ireland.css",
              "ireland.js",
              "og.png",
              "print-studio.html",
              "robots.txt",
              "site.webmanifest",
              "sitemap.xml",
              "styles.css",
              "sw.js",
              "data/geometry.csv",
              "data/geometry.js",
              "data/geometry.json",
              "data/geometry.schema.json",
          }
          expected.update(path.as_posix() for path in research_files)
          if custom_domain.is_file():
              expected.add("CNAME")
          actual = {path.relative_to(site).as_posix() for path in site.rglob("*") if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected Pages artifact contents: {sorted(actual)}")
          print(f"Prepared curated Pages artifact with {len(actual)} public files.")
          PY
      - name: Stamp deployed site metadata
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_CACHE_NAME: sacred-geometry-atlas-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/") + "/"
          cache_name = os.environ.get("PAGES_CACHE_NAME", "").strip()
          if not re.fullmatch(r"sacred-geometry-atlas-[0-9a-f]{40}", cache_name):
              raise SystemExit("PAGES_CACHE_NAME must contain the 40-character GitHub commit SHA")
          dataset_url = html.escape(base_url + "data/geometry.json", quote=True)
          csv_url = html.escape(base_url + "data/geometry.csv", quote=True)
          schema_target = base_url + "data/geometry.schema.json"
          schema_url = html.escape(schema_target, quote=True)
          site = Path("_site")
          page = site / "index.html"
          source = page.read_text()
          replacements = {
              '<link rel="canonical" href="./" />': f'<link rel="canonical" href="{html.escape(base_url, quote=True)}" />',
              '<meta property="og:url" content="./" />': f'<meta property="og:url" content="{html.escape(base_url, quote=True)}" />',
              '<meta property="og:image" content="og.png" />': f'<meta property="og:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
              '<meta name="twitter:image" content="og.png" />': f'<meta name="twitter:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
              '"@id": "data/geometry.json"': f'"@id": "{dataset_url}"',
              '"contentUrl": "data/geometry.json"': f'"contentUrl": "{dataset_url}"',
              '"contentUrl": "data/geometry.csv"': f'"contentUrl": "{csv_url}"',
              '"contentUrl": "data/geometry.schema.json"': f'"contentUrl": "{schema_url}"',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Missing repository-relative metadata: {old}")
              source = source.replace(old, new)
          page.write_text(source)

          static_page = site / "static.html"
          static_source = static_page.read_text()
          static_replacements = {
              '<link rel="canonical" href="static.html" />': f'<link rel="canonical" href="{html.escape(base_url + "static.html", quote=True)}" />',
              '<meta property="og:url" content="static.html" />': f'<meta property="og:url" content="{html.escape(base_url + "static.html", quote=True)}" />',
              '<meta property="og:image" content="og.png" />': f'<meta property="og:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
              '<meta name="twitter:image" content="og.png" />': f'<meta name="twitter:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
          }
          for old, new in static_replacements.items():
              if old not in static_source:
                  raise SystemExit(f"Missing repository-relative static-page metadata: {old}")
              static_source = static_source.replace(old, new)
          static_page.write_text(static_source)

          print_page = site / "print-studio.html"
          print_source = print_page.read_text()
          print_replacements = {
              '<link rel="canonical" href="print-studio.html" />': f'<link rel="canonical" href="{html.escape(base_url + "print-studio.html", quote=True)}" />',
              '<meta property="og:url" content="print-studio.html" />': f'<meta property="og:url" content="{html.escape(base_url + "print-studio.html", quote=True)}" />',
              '<meta property="og:image" content="og.png" />': f'<meta property="og:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
              '<meta name="twitter:image" content="og.png" />': f'<meta name="twitter:image" content="{html.escape(base_url + "og.png", quote=True)}" />',
          }
          for old, new in print_replacements.items():
              if old not in print_source:
                  raise SystemExit(f"Missing repository-relative Print Studio metadata: {old}")
              print_source = print_source.replace(old, new)
          print_page.write_text(print_source)

          dataset = site / "data/geometry.json"
          dataset_source = dataset.read_text()
          dataset_marker = '"schemaUrl": "data/geometry.schema.json"'
          if dataset_marker not in dataset_source:
              raise SystemExit(f"Missing repository-relative dataset schema URL: {dataset_marker}")
          dataset.write_text(dataset_source.replace(dataset_marker, f'"schemaUrl": "{schema_target}"', 1))

          csv = site / "data/geometry.csv"
          csv_source = csv.read_text()
          csv_marker = '"data/geometry.schema.json"'
          if csv_marker not in csv_source:
              raise SystemExit(f"Missing repository-relative CSV schema URL: {csv_marker}")
          csv.write_text(csv_source.replace(csv_marker, f'"{schema_target}"'))

          schema = site / "data/geometry.schema.json"
          schema_source = schema.read_text()
          schema_replacements = {
              '"$id": "./geometry.schema.json"': f'"$id": "{schema_target}"',
              '"const": "data/geometry.schema.json"': f'"const": "{schema_target}"',
          }
          for old, new in schema_replacements.items():
              if old not in schema_source:
                  raise SystemExit(f"Missing repository-relative schema metadata: {old}")
              schema_source = schema_source.replace(old, new, 1)
          schema.write_text(schema_source)

          service_worker = site / "sw.js"
          service_worker_source = service_worker.read_text()
          source_cache_marker = 'const CACHE_NAME = "sacred-geometry-atlas-v2";'
          if source_cache_marker not in service_worker_source:
              raise SystemExit(f"Missing repository service-worker cache marker: {source_cache_marker}")
          service_worker.write_text(service_worker_source.replace(source_cache_marker, f'const CACHE_NAME = "{cache_name}";', 1))

          not_found = site / "404.html"
          not_found_source = not_found.read_text()
          not_found_replacements = {
              '<a class="home-link" data-site-root href="../">': f'<a class="home-link" data-site-root href="{html.escape(base_url, quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-method href="../#method">': f'<a class="home-link home-link-secondary" data-site-method href="{html.escape(base_url + "#method", quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-static href="static.html">': f'<a class="home-link home-link-secondary" data-site-static href="{html.escape(base_url + "static.html", quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-dataset href="data/geometry.json">': f'<a class="home-link home-link-secondary" data-site-dataset href="{html.escape(base_url + "data/geometry.json", quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-csv href="data/geometry.csv">': f'<a class="home-link home-link-secondary" data-site-csv href="{html.escape(base_url + "data/geometry.csv", quote=True)}">',
              '<a class="home-link home-link-secondary" data-site-schema href="data/geometry.schema.json">': f'<a class="home-link home-link-secondary" data-site-schema href="{schema_url}">',
              '<link rel="icon" id="site-favicon" href="favicon.svg" type="image/svg+xml" />': f'<link rel="icon" id="site-favicon" href="{html.escape(base_url + "favicon.svg", quote=True)}" type="image/svg+xml" />',
              '<link rel="manifest" id="site-manifest" href="site.webmanifest" />': f'<link rel="manifest" id="site-manifest" href="{html.escape(base_url + "site.webmanifest", quote=True)}" />',
              '<link rel="apple-touch-icon" id="site-apple-touch-icon" sizes="180x180" href="icons/atlas-180.png" />': f'<link rel="apple-touch-icon" id="site-apple-touch-icon" sizes="180x180" href="{html.escape(base_url + "icons/atlas-180.png", quote=True)}" />',
          }
          for old, new in not_found_replacements.items():
              if old not in not_found_source:
                  raise SystemExit(f"Missing repository-relative 404 recovery link: {old}")
              not_found_source = not_found_source.replace(old, new)
          not_found.write_text(not_found_source)

          robots = site / "robots.txt"
          robots_source = robots.read_text()
          robots_marker = "Sitemap: ./sitemap.xml"
          robots_value = f"Sitemap: {html.escape(base_url + 'sitemap.xml', quote=True)}"
          if robots_marker not in robots_source:
              raise SystemExit(f"Missing repository-relative crawl marker: {robots_marker}")
          robots.write_text(robots_source.replace(robots_marker, robots_value))

          sitemap = site / "sitemap.xml"
          sitemap_source = sitemap.read_text()
          sitemap_markers = {
              "<loc>./</loc>": f"<loc>{html.escape(base_url, quote=True)}</loc>",
              "<loc>./static.html</loc>": f"<loc>{html.escape(base_url + 'static.html', quote=True)}</loc>",
              "<loc>./ireland.html</loc>": f"<loc>{html.escape(base_url + 'ireland.html', quote=True)}</loc>",
              "<loc>./print-studio.html</loc>": f"<loc>{html.escape(base_url + 'print-studio.html', quote=True)}</loc>",
              "<loc>./research/annotated-atlas.html</loc>": f"<loc>{html.escape(base_url + 'research/annotated-atlas.html', quote=True)}</loc>",
              "<loc>./data/geometry.json</loc>": f"<loc>{html.escape(base_url + 'data/geometry.json', quote=True)}</loc>",
              "<loc>./data/geometry.csv</loc>": f"<loc>{html.escape(base_url + 'data/geometry.csv', quote=True)}</loc>",
              "<loc>./data/geometry.schema.json</loc>": f"<loc>{html.escape(base_url + 'data/geometry.schema.json', quote=True)}</loc>",
          }
          for sitemap_marker, sitemap_value in sitemap_markers.items():
              if sitemap_marker not in sitemap_source:
                  raise SystemExit(f"Missing repository-relative sitemap marker: {sitemap_marker}")
              sitemap_source = sitemap_source.replace(sitemap_marker, sitemap_value)
          sitemap.write_text(sitemap_source)
          print(f"Stamped absolute Pages metadata and crawl URLs for {base_url}")
          PY
      - name: Verify curated Pages artifact
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_CACHE_NAME: sacred-geometry-atlas-${{ github.sha }}
        run: |
          python3 scripts/verify-pages-artifact.py
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "_site"
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
