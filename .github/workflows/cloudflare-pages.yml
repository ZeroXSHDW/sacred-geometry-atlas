name: Deploy marketfront to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check patch hygiene
        run: git diff --check
      - name: Validate workflow contract
        run: node scripts/validate-workflow.mjs
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Validate atlas data contract
        run: |
          node --check app.js
          node --check data/geometry.js
          node --check sw.js
          node scripts/validate-geometry-data.js
          node scripts/sync-geometry-json.js --check
      - name: Validate Ireland lab and build artifact
        run: |
          node --check ireland.js
          python3 -m py_compile scripts/prepare-cloudflare-site.py
          python3 scripts/prepare-cloudflare-site.py
          test -s .cloudflare-site/ireland.html
          test -s .cloudflare-site/ireland.css
          test -s .cloudflare-site/ireland.js
          test -s .cloudflare-site/print-studio.html
          test -s .cloudflare-site/research/annotated-atlas.html
          test -s .cloudflare-site/research/image-manifest.json
          test -s .cloudflare-site/_redirects
          test -s .cloudflare-site/_headers

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-pages
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check patch hygiene
        run: git diff --check
      - name: Prepare the public artifact
        run: python3 scripts/prepare-cloudflare-site.py
      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy .cloudflare-site --project-name=zerodevllc-marketfront --branch=main
